<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root,:root[data-theme=light]{
    color-scheme:light;
    --ground:#E7EBE7; --surf:#F8FAF8; --ink:#15201B; --ink2:#55625B; --line:#C0CAC3;
    --blue:#23417A; --blue-fg:#fff; --pine:#2F6B4F; --pine-fg:#fff;
    --ochre:#9A6410; --ochre-fg:#fff; --red:#9C3427; --red-fg:#fff;
    --bog:#EBD9B8; --bog-fg:#4A3405; --bog-bd:#D8BE8C;
    --bird:#AFCCF0; --bird-fg:#0F2A55; --bird-bd:#7FA5D8;
    --eag:#23417A; --eag-fg:#FFFFFF;
    --r:3px;
  }
  @media (prefers-color-scheme:dark){:root{
    color-scheme:dark;
    --ground:#0E1210; --surf:#242B26; --ink:#EDF2EE; --ink2:#A6B3AA; --line:#6E8075;
    --blue:#8FB0DE; --blue-fg:#0A1424; --pine:#6FBE93; --pine-fg:#0B1710;
    --ochre:#DCA648; --ochre-fg:#231702; --red:#E07A6B; --red-fg:#2A0C07;
    --bog:#7B6838; --bog-fg:#F5EACE; --bog-bd:#A08C58;
    --bird:#43659B; --bird-fg:#DCE8FA; --bird-bd:#6B8CC0;
    --eag:#8FB0DE; --eag-fg:#0A1424;
  }}
  :root[data-theme=dark]{
    color-scheme:dark;
    --ground:#0E1210; --surf:#242B26; --ink:#EDF2EE; --ink2:#A6B3AA; --line:#6E8075;
    --blue:#8FB0DE; --blue-fg:#0A1424; --pine:#6FBE93; --pine-fg:#0B1710;
    --ochre:#DCA648; --ochre-fg:#231702; --red:#E07A6B; --red-fg:#2A0C07;
    --bog:#7B6838; --bog-fg:#F5EACE; --bog-bd:#A08C58;
    --bird:#43659B; --bird-fg:#DCE8FA; --bird-bd:#6B8CC0;
    --eag:#8FB0DE; --eag-fg:#0A1424;
  }
  html{background:var(--ground);min-height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;
    padding:0 0 calc(56px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
  .num{font-family:'Saira Condensed',sans-serif;font-weight:700;letter-spacing:.01em}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;font-weight:600}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--surf);color:var(--ink);border-radius:var(--r);padding:10px 8px;
    transition:none}
  button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  button.on{background:var(--ink);color:var(--surf);border-color:var(--ink)}
  button.on-pine{background:var(--pine);color:var(--pine-fg);border-color:var(--pine)}
  button.on-red{background:var(--red);color:var(--red-fg);border-color:var(--red)}
  button.on-ochre{background:var(--ochre);color:var(--ochre-fg);border-color:var(--ochre)}
  input,select{font-family:'IBM Plex Mono',monospace;font-size:16px;padding:9px 10px;
    border:1px solid var(--line);border-radius:var(--r);background:var(--surf);color:var(--ink);width:100%}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
  .wrap{padding:0 14px}
  header{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:600}
  nav{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-bottom:1px solid var(--line);background:var(--surf)}
  nav button{border:0;border-right:1px solid var(--line);border-radius:0;padding:13px 4px;
    font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--ink2);background:var(--surf)}
  nav button:last-child{border-right:0}
  nav button.on{background:var(--ink);color:var(--surf)}
  .strip{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin:12px 0 4px}
  .cell{position:relative;aspect-ratio:1/1.15;border:1px solid var(--line);border-radius:2px;background:var(--surf);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
    font-family:'IBM Plex Mono',monospace;color:var(--ink2);padding:0;min-width:0}
  .cell .st{position:absolute;top:0;right:2px;font-size:10px;line-height:1;font-weight:400;
    font-family:system-ui,-apple-system,sans-serif;pointer-events:none;
    text-shadow:0 0 2px var(--surf),0 0 2px var(--surf),0 0 2px var(--surf)}
  .cell .st.t1{color:var(--ink)}
  .cell .st.t2{color:var(--ink2);opacity:.55}
  .cell.cur{outline:2px solid var(--blue);outline-offset:1px}
  .cell.p{background:var(--surf);color:var(--ink2);border-style:dashed;border-color:var(--ink2)}
  .cell.e{background:var(--eag);color:var(--eag-fg);border-color:var(--eag)}
  .cell.bi{background:var(--bird);color:var(--bird-fg);border-color:var(--bird-bd)}
  .cell.g{background:var(--pine);color:var(--pine-fg);border-color:var(--pine)}
  .cell.b{background:var(--bog);color:var(--bog-fg);border-color:var(--bog-bd)}
  .cell.d{background:var(--red);color:var(--red-fg);border-color:var(--red)}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .row .lab{flex:0 0 66px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink2);font-weight:600}
  .seg{display:flex;gap:5px;flex:1}
  .seg button{flex:1;padding:12px 4px;font-size:13px;font-weight:500}
  .step{display:flex;align-items:center;gap:8px;flex:1}
  .step button{width:52px;height:48px;font-size:22px;line-height:1;padding:0}
  .step .val{flex:1;text-align:center;font-size:30px}
  .card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:0}
  .kv b{font-family:'IBM Plex Mono',monospace;font-weight:500}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .met{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:10px}
  .met .v{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1}
  .met .l{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-top:3px}
  .banner{border-left:3px solid var(--blue);background:var(--surf);padding:10px 12px;
    font-size:13px;margin:10px 0;border-radius:0}
  .banner.warn{border-left-color:var(--ochre)}
  .banner.bad{border-left-color:var(--red)}
  table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
  th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
  td{padding:6px 4px;border-bottom:1px solid var(--line)}
  .big{width:100%;padding:15px;font-size:14px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;background:var(--ink);color:var(--surf);border-color:var(--ink);margin:8px 0}
  .ghost{background:var(--surf);color:var(--ink);border-color:var(--ink)}
  .quiet{background:var(--surf);color:var(--ink2);border-color:var(--line)}
  .hint{font-size:12px;color:var(--ink2);margin:5px 0 0}
  .hide{display:none}
  textarea{font-family:'IBM Plex Sans',sans-serif;font-size:16px;padding:9px 10px;width:100%;
    border:1px solid var(--line);border-radius:var(--r);background:var(--surf);color:var(--ink);min-height:90px}
  textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chips button{flex:0 0 auto;padding:9px 11px;font-size:13px}
  details summary{cursor:pointer;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    font-weight:600;color:var(--blue);padding:12px 0;list-style:none}
  details summary::-webkit-details-marker{display:none}
  .navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 0}
  .navrow button{padding:15px;font-weight:600}
  .pill{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    font-weight:600;padding:3px 7px;border-radius:2px;background:var(--ground);color:var(--ink2)}
  @media (prefers-reduced-motion:no-preference){button{transition:background .1s}}
</style>

<header>
  <div class="eyebrow">Paces · Jan Sun</div>
  <h1 class="num" style="font-size:27px;line-height:1.1;margin-top:2px">10 → 5</h1>
  <div id="hdr" style="font-size:11.5px;font-weight:600;margin-top:4px">Paced, not guessed.</div>
</header>

<nav>
  <button id="t-play" class="on" onclick="go('play')">Play</button>
  <button id="t-practice" onclick="go('practice')">Practice</button>
  <button id="t-rounds" onclick="go('rounds')">Rounds</button>
  <button id="t-stats" onclick="go('stats')">Stats</button>
  <button id="t-data" onclick="go('data')">Data</button>
</nav>

<div id="errbox" class="wrap hide"></div>
<div id="v-play" class="wrap"></div>
<div id="v-practice" class="wrap hide"></div>
<div id="v-rounds" class="wrap hide"></div>
<div id="v-stats" class="wrap hide"></div>
<div id="v-data" class="wrap hide"></div>

<script>
const VER='2.7 \u00b7 1 Sep 2026';
const CLUBS=['LW','SW','GW','PW','9i','8i','7i','6i','5i','4H','5W','3W','Dr'];
const PUTT_B=['0-1','2-3','4-6','7-10','11+'];
const KEY='golf:v1';
var STMODE='none';
var ST={
  get:function(k){
    if(window.storage&&window.storage.get)return window.storage.get(k);
    try{var v=localStorage.getItem(k);
      if(v===null)return Promise.reject(new Error('not found'));
      return Promise.resolve({key:k,value:v});}
    catch(e){return Promise.reject(e);}
  },
  set:function(k,v){
    if(window.storage&&window.storage.set)return window.storage.set(k,v);
    try{localStorage.setItem(k,v);return Promise.resolve({key:k,value:v});}
    catch(e){return Promise.reject(e);}
  }
};
function detectStore(){
  if(window.storage&&window.storage.set){STMODE='app';return;}
  try{localStorage.setItem('golf:probe','1');localStorage.removeItem('golf:probe');STMODE='browser';}
  catch(e){STMODE='none';}
}
const GENERIC=[4,4,3,5,4,4,4,3,5,4,4,5,4,3,4,4,3,5];
const CD={
 'Stolpe Ost':{par:[4,4,3,5,4,4,4,3,5,4,4,5,4,3,4,4,3,5],
   tees:{'Weiss 6403 m':[74.3,129],'Gelb 6025 m':[72.2,129],'Blau 5563 m':[69.9,121]}},
 'Stolpe West':{par:[5,4,4,3,5,3,5,3,4,4,5,3,4,3,4,5,4,4],
   tees:{'Schwarz 6496 m':[74.8,128],'Weiss 6171 m':[73.1,127],'Gelb 5898 m':[71.7,126],'Blau 5419 m':[69.3,118]}},
 'GC Gatow':{par:[4,4,5,3,4,5,3,4,4,4,4,3,4,4,5,3,5,4],
   tees:{'Gelb 5825 m':[71.3,126],'Blau 5508 m':[69.4,124]}},
 'Other':{par:null,tees:{}}
};
const COURSES=Object.keys(CD);
const CLABEL={'GC Gatow':'Gatow'};
const CFIX={'Stolper Heide Ost':'Stolpe Ost','Stolper Heide West':'Stolpe West'};

let db={rounds:[],sessions:[],stride:null};
let cur=null, sess=null, hole=0, view='play', storeOk=true, t2Open=true, flash='', finishing=false, legend=false, RO=false, vwId=null, vwHole=0;
const TEE_CLUBS=['Dr','3W','5W','4H','5i','6i','7i'];
const AREAS=['Range','Clubs','Short game','Putting','Bunker'];
function blankSess(){return{id:Date.now()*1000+Math.floor(Math.random()*1000),date:new Date().toISOString().slice(0,10),
  areas:[],clubs:[],balls:'',mins:'',wrist:0,note:''};}

function blankHole(p){return{par:p,score:p,putts:2,pu:null,tee:null,gir:null,pen:null,
  penTee:null,rec:null,ss:null,teeClub:null,teeOut:null,appFlag:'',appDist:'',appClub:'',
  appD:null,appL:null,appAlt:null,
  appKind:'green',appNo:null,p5:null,con:null,rec2:null,fp:null,fpD:null,fpL:null,chip:null};}
function atGreen(h){return h.appKind!=='lay'&&h.appKind!=='punch'&&h.appKind!=='no';}
function adj(h){var f=+h.appFlag||0,p=+h.appDist||0; return (f&&p)?p-f:null;}
function pctOf(h){var f=+h.appFlag||0,a=adj(h); return (f&&a!==null)?Math.round(1000*a/f)/10:null;}
function pctSet(v){const h=cur.holes[hole];
  var f=+h.appFlag||0;
  var raw=String(v==null?'':v).replace(',','.').replace(/[%\s]/g,'');
  if(raw===''){h.done=true;save();render();return;}
  var q=parseFloat(raw);
  if(!isFinite(q)||!f){h.done=true;save();render();return;}
  h.appDist=String(Math.round(f*(1+q/100)));
  h.done=true;save();render();}
function defNo(h){return h.par===3?1:(h.par===5?((h.p5==='hit'||h.p5==='miss')?2:3):2);}
function bumpNo(d){const h=cur.holes[hole];h.appNo=Math.max(1,Math.min(8,(h.appNo||defNo(h))+d));h.done=true;save();render();}
function migrate(){
  (db.rounds||[]).forEach(function(r){(r.holes||[]).forEach(function(h){h.done=true;});});
  var FPMAP={'2-4':'2-3','5-9':'7-10','10+':'11+'};
  var CHIPMAP={'0-1':'0-1','2-4':'2-3','5+':'7-10'};
  (db.rounds||[]).forEach(function(r){(r.holes||[]).forEach(function(h){
    if(h.fp&&FPMAP[h.fp])h.fp=FPMAP[h.fp];
    if(h.bunker===true&&!h.rec)h.rec='bunker';
    if(h.chip!==undefined&&h.chip!==null){
      if(!h.fp&&CHIPMAP[h.chip])h.fp=CHIPMAP[h.chip];
      delete h.chip;}
  });});
  (db.rounds||[]).forEach(r=>{if(CFIX[r.course])r.course=CFIX[r.course];});
  if(cur&&CFIX[cur.course])cur.course=CFIX[cur.course];
  if(CFIX[db.lastCourse])db.lastCourse=CFIX[db.lastCourse];
  if(db.lastTee&&!COURSES.some(c=>teeList(c).includes(db.lastTee)))db.lastTee=null;
  if(!db.lastTee)db.lastTee=defaultTee(db.lastCourse||COURSES[0]);
  const M={hit:['pin','ctr'],short:['short',null],long:['long',null],
           left:[null,'left'],right:[null,'right']};
  (db.rounds||[]).forEach(r=>(r.holes||[]).forEach(h=>{
    if(h.appRes&&M[h.appRes]){h.appD=h.appD||M[h.appRes][0];h.appL=h.appL||M[h.appRes][1];delete h.appRes;}}));
  if(cur)(cur.holes||[]).forEach(h=>{
    if(h.appRes&&M[h.appRes]){h.appD=h.appD||M[h.appRes][0];h.appL=h.appL||M[h.appRes][1];delete h.appRes;}});
  var wuFix=function(r){
    if(r.wuBalls===undefined||r.wuBalls===null||r.wuBalls==='')r.wuBalls=r.warmup||'';
    if(r.wuPutts===undefined||r.wuPutts===null)r.wuPutts='';
    if(r.wuMins===undefined||r.wuMins===null)r.wuMins='';
    if(r.wuRoute===undefined)r.wuRoute=null;};
  (db.rounds||[]).forEach(wuFix); if(cur)wuFix(cur);
  (db.rounds||[]).forEach(function(r){if(r._snap)delete r._snap;});
  var cfix=function(h){if(h.con===undefined)h.con=null; if(h.rec2===undefined)h.rec2=null; if(h.stg!==undefined)delete h.stg;};
  (db.rounds||[]).forEach(function(r){(r.holes||[]).forEach(cfix);});
  if(cur)(cur.holes||[]).forEach(cfix);
}

function newRound(n,course,startHole){
  const base=(CD[course]&&CD[course].par)||GENERIC;
  const st=Math.max(1,Math.min(18,+startHole||1));
  const pars=[], hnos=[];
  for(var p=0;p<n;p++){var idx=(st-1+p)%18;pars.push(base[idx]);hnos.push(idx+1);}
  return{id:Date.now()*1000+Math.floor(Math.random()*1000),date:new Date().toISOString().slice(0,10),course:course,start:st,
    tees:'',cr:null,slope:null,n:n,tier2:true,t2open:true,wind:null,carry:null,
    warmup:'',wuBalls:'',wuPutts:'',wuMins:'',wuRoute:null,wristPre:0,wristPost:null,note:'',
    holes:pars.map(function(pp,i){var h=blankHole(pp);h.hno=hnos[i];return h;})};
}
function hno(h,i){return (h&&h.hno)?h.hno:i+1;}
function teeList(c){return Object.keys((CD[c]&&CD[c].tees)||{});}
function setTee(t){const T=CD[cur.course]&&CD[cur.course].tees[t];
  cur.tees=t;cur.cr=T?T[0]:null;cur.slope=T?T[1]:null;db.lastTee=t;save();finish();}

function applyTheme(){
  const t=db.theme||'auto';
  const dark = t==='dark' || (t==='auto' && window.matchMedia
    && window.matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
}
function setTheme(t){db.theme=t;applyTheme();save();render();}

async function load(){
  detectStore();
  try{const r=await ST.get(KEY);
    if(r&&r.value){const d=JSON.parse(r.value);db.rounds=d.rounds||[];db.sessions=d.sessions||[];db.stride=d.stride??null;
      db.theme=d.theme||'auto';db.t2default=d.t2default;db.lastCourse=d.lastCourse;db.lastTee=d.lastTee;db.startHole=d.startHole;
      cur=d.cur||null;hole=d.hole||0;
      t2Open=cur?(cur.t2open!==false):(db.t2default!==false);}
  }catch(e){ if(String(e).includes('not found')||String(e).includes('404')){storeOk=true;}else{storeOk=false;} }
  migrate();
  applyTheme();
  try{
    var mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)');
    if(mq&&mq.addEventListener)mq.addEventListener('change',applyTheme);
    else if(mq&&mq.addListener)mq.addListener(applyTheme);
  }catch(e){}
  render();
}
let saveTimer=null;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{await ST.set(KEY,JSON.stringify({rounds:db.rounds,sessions:db.sessions,stride:db.stride,theme:db.theme,t2default:db.t2default,lastCourse:db.lastCourse,lastTee:db.lastTee,startHole:db.startHole,cur:cur,hole:hole}));
      storeOk=true;}
    catch(e){storeOk=false;}
    var h=document.getElementById('hdr');
    if(h){h.textContent=storeOk?('\u25cf Saving \u00b7 '+db.rounds.length+' rounds logged')
      :'\u25b2 NOT SAVING \u2014 copy the JSON from Data before you close this';
      h.style.color=storeOk?'var(--pine)':'var(--red)';}
  },250);
}

function go(v){view=v;flash='';saveMsg='';armed='';['play','practice','rounds','stats','data'].forEach(k=>{
  document.getElementById('v-'+k).classList.toggle('hide',k!==v);
  document.getElementById('t-'+k).classList.toggle('on',k===v);});render();}

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function set(path,val){const h=cur.holes[hole];h[path]=val;h.done=true;save();render();}
function tog(path,val){const h=cur.holes[hole];h[path]=(h[path]===val?null:val);
  h.done=true; if(cur)cur.t2open=t2Open; save();render();}
function bump(f,d){const h=cur.holes[hole];h[f]=Math.max(0,Math.min(15,h[f]+d));h.done=true;save();render();}
function meta(f,v){cur[f]=v;save();render();}

function showErr(msg){
  var e=document.getElementById('errbox'); if(!e)return;
  e.classList.remove('hide');
  e.innerHTML='<div class="banner bad"><b>Something broke.</b> '+
    String(msg).replace(/[<>&]/g,'')+
    '<br>Export from Data before doing anything else. '+
    '<button style="padding:4px 10px;font-size:12px;margin-top:8px" onclick="hideErr()">Dismiss</button></div>';
}
function hideErr(){var e=document.getElementById('errbox');
  if(e){e.innerHTML='';e.classList.add('hide');}}
window.onerror=function(m,src,line){
  // "Script error." with no source is a cross-origin error the browser refuses to
  // describe. It cannot come from this file, so reporting it only causes alarm.
  if(!src||String(m).indexOf('Script error')===0)return true;
  showErr(m+'  ('+String(src).split('/').pop()+' line '+line+')');
  return true;
};

function render(){
  try{ renderInner(); }catch(err){ showErr(err&&err.message?err.message:err); }
}
function renderInner(){
  if(view==='play')renderPlay();
  if(view==='practice')renderPractice();
  if(view==='rounds')renderRounds();
  if(view==='stats')renderStats();

function missList(x,t2){
  var a=[],b=[];
  if(!x||!x.done)return{a:a,b:b};
  if(x.par>3&&!x.tee)a.push('tee result');
  if(x.par>3&&!x.teeClub)a.push('tee club');
  if(x.gir===null||x.gir===undefined)a.push('green hit');
  if(a.length)return{a:a,b:b};
  var T2=(t2===undefined)?(cur&&cur.tier2):t2;
  if(!T2)return{a:a,b:b};
  if(x.par===5&&!x.p5)b.push('par-5 2nd shot');
  if(atGreen(x)){
    if(!x.appFlag)b.push('flag');
    if(!x.appDist)b.push('play to');
    if(!x.appClub)b.push('approach club');
    if(!x.appD)b.push('distance miss');
    if(!x.appL)b.push('line miss');
  }
  if(x.gir===false){
    if(x.ss===null||x.ss===undefined)b.push('position');
    if(!x.rec)b.push('recovery');
    if(x.rec2===null||x.rec2===undefined)b.push('after it');
  }
  if(!x.pu){
    if(!x.fp)b.push('1st putt');
    else if(x.putts>1){ if(!x.fpD)b.push('putt speed'); if(!x.fpL)b.push('putt line'); }
  }
  return{a:a,b:b};
}
function missTier(x,t2){var m=missList(x,t2);return m.a.length?1:(m.b.length?2:0);}
function starCount(){var a=0,b=0;(cur?cur.holes:[]).forEach(function(x){var m=missTier(x);
  if(m===1)a++; else if(m===2)b++;});return[a,b];}
function cellHTML(x,i){
  const d=x.score-x.par; let c='';
  if(x.pu){ c='p'; } else if(x.done){ c = d<=-2?'e':(d===-1?'bi':(d===0?'g':(d===1?'b':'d'))); }
  const m=RO?0:missTier(x);
  const star=m?`<span class="st ${m===1?'t1':'t2'}">\u2605</span>`:'';
  return `<button class="cell ${c} ${i===hole?'cur':''}" onclick="${RO?`vwGo(${i})`:`hole=${i};save();render()`}">${hno(x,i)}${star}</button>`;
}
function sBtn(f,v,label,cls){const h=cur.holes[hole];
  return `<button class="${h[f]===v?(cls||'on'):''}" onclick="tog('${f}',${typeof v==='boolean'?v:"'"+v+"'"})">${label}</button>`;}
function setPar(p){const h=cur.holes[hole];const diff=h.score-h.par;h.par=p;h.score=Math.max(1,p+diff);h.done=true;save();render();}
async function saveNow(){
  clearTimeout(saveTimer);
  try{
    await ST.set(KEY,JSON.stringify({rounds:db.rounds,sessions:db.sessions,
      stride:db.stride,theme:db.theme,t2default:db.t2default,lastCourse:db.lastCourse,
      lastTee:db.lastTee,cur:cur,hole:hole}));
    storeOk=true;
    var d=new Date();
    saveMsg='Saved at '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+
      ' \u2014 hole '+(hole+1)+' of '+cur.n+'. Safe to close.';
  }catch(e){
    storeOk=false;
    saveMsg='SAVE FAILED. Do not close this. Go to Data and copy the JSON now.';
  }
  render();
}
function endHere(){
  cur.holes[hole].done=true; cur.endAt=hole+1; save(); finish();
}
function endCount(){return cur.endAt||cur.n;}
function arm(k){armed=(armed===k?'':k);render();}
function discard(){
  cur=null; hole=0; finishing=false; armed=''; save(); render(); window.scrollTo(0,0);
}
function nav(d){if(d>0)cur.holes[hole].done=true;
  hole=Math.max(0,Math.min(cur.n-1,hole+d));save();render();window.scrollTo(0,0);}
function liveHoles(){var lim=(finishing&&cur.endAt)?cur.endAt:cur.n;return cur.holes.slice(0,lim);}
function played(){return liveHoles().filter(function(x){return x.done;});}
function scored(){return liveHoles().filter(function(x){return x.done&&!x.pu;});}
function puCount(){return liveHoles().filter(function(x){return x.pu;}).length;}
function toPar(P){
  var t=P.reduce(function(a,x){return a+x.score},0);
  var p=P.reduce(function(a,x){return a+x.par},0);
  var d=t-p; return d===0?'E':((d>0?'+':'')+d);}
function runningTotal(){
  var P=played(); if(!P.length)return 'not started';
  var S=scored(), u=puCount();
  if(!S.length)return P.length+' holes logged \u00b7 no score';
  return toPar(S)+' thru '+S.length+(u?' \u00b7 '+u+' picked up':'');}
function finalTotal(){
  var S=scored(), u=puCount();
  if(!S.length)return 'no score';
  var t=S.reduce(function(a,x){return a+x.score},0);
  return u? toPar(S)+' thru '+S.length : t+' ('+toPar(S)+')';}
function defaultTee(c){
  var TL=teeList(c);
  for(var i=0;i<TL.length;i++){if(TL[i].indexOf('Gelb')===0)return TL[i];}
  return TL[0]||null;
}
function teePicker(){
  var C=db.lastCourse||COURSES[0];
  var TL=teeList(C);
  if(!TL.length){
    return '<p class="hint">No ratings stored for '+(CLABEL[C]||C)+
           ' — enter CR and slope at round close if you want a differential.</p>';}
  var out='<div class="eyebrow" style="margin:14px 0 6px">Tee</div><div class="chips">';
  for(var i=0;i<TL.length;i++){
    out+='<button class="'+(db.lastTee===TL[i]?'on':'')+'" onclick="setTeeDefault(\''+TL[i]+'\')">'+TL[i]+'</button>';}
  out+='</div>';
  var T=(CD[C]&&CD[C].tees[db.lastTee])||null;
  out+='<p class="hint">'+(T&&T[0]
    ? 'CR '+T[0]+' \u00b7 slope '+T[1]+' — differential calculated automatically.'
    : 'Pick a tee so the round gets a differential.')+
    ' Gelb is preselected \u2014 switch only when you actually move back.</p>';
  return out;
}
function holeGrid(){
  var c=db.startHole||1;
  var out='<div class="card"><div class="eyebrow" style="margin-bottom:6px">First hole</div>'+
    '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:5px">';
  for(var i=1;i<=18;i++){
    out+='<button class="'+(c===i?'on':'')+'" style="padding:11px 0;font-size:13px" onclick="setStartHole('+i+')">'+i+'</button>';}
  out+='</div><p class="hint" style="margin:8px 0 0">H10 with 9 holes gives you the back nine. '+
    'Any other hole wraps round for a shotgun start, and the pars follow the real hole numbers.</p></div>';
  return out;
}
function setStartHole(i){db.startHole=i;armed='';save();render();}
function setT2Default(v){db.t2default=v;save();render();}
function setCourse(c){db.lastCourse=c;
  if(!teeList(c).includes(db.lastTee))db.lastTee=defaultTee(c);
  save();render();}
function setTeeDefault(t){db.lastTee=t;save();render();}
function start(n){
  const C=db.lastCourse||COURSES[0];
  cur=newRound(n,C,db.startHole||1);
  if(db.lastTee&&CD[C]&&CD[C].tees[db.lastTee]){
    const T=CD[C].tees[db.lastTee];
    cur.tees=db.lastTee; cur.cr=T[0]; cur.slope=T[1];}
  t2Open=db.t2default!==false; cur.t2open=t2Open; finishing=false;
  hole=0;save();render();window.scrollTo(0,0);}
function finish(){
  if(!cur._snap)cur._snap=cur.holes.map(function(h){return !!h.done;});
  var lim=cur.endAt||cur.n;
  cur.holes.forEach(function(h,i){if(i<lim)h.done=true;});
  finishing=true;save();render();}
function fixHole(i){
  if(cur._snap){cur.holes.forEach(function(h,j){h.done=!!cur._snap[j];});delete cur._snap;}
  finishing=false; armed=''; hole=Math.max(0,Math.min(cur.n-1,i));
  save(); render(); window.scrollTo(0,0);}
function unfinish(){
  if(cur._snap){cur.holes.forEach(function(h,i){h.done=!!cur._snap[i];});delete cur._snap;}
  delete cur.endAt; finishing=false; armed=''; save(); render(); window.scrollTo(0,0);}
function renderFinish(){
  const el=document.getElementById('v-play');
  el.innerHTML=`<div class="card">
    <div class="eyebrow">Close out</div>
    <h2 class="num" style="font-size:34px;margin:4px 0 4px">${finalTotal()}</h2>
    <p class="hint" style="margin:0 0 10px">${endCount()} holes${endCount()===18?' · counts for handicap':(endCount()===9?' · 9-hole score':' · partial round, stats only')}${cur.endAt&&cur.endAt<cur.n?' · holes '+(cur.endAt+1)+'-'+cur.n+' dropped':''}</p>
    <div class="row"><div class="lab">Course</div><select onchange="meta('course',this.value);finish()">
      ${COURSES.map(c=>`<option value="${c}" ${cur.course===c?'selected':''}>${CLABEL[c]||c}</option>`).join('')}</select></div>
