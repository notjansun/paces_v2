<!doctype html>
<meta charset="utf-8">
<title>Paces</title>
<meta name="apple-mobile-web-app-title" content="Paces">
<meta name="theme-color" content="#E7EBE7" media="(prefers-color-scheme:light)">
<meta name="theme-color" content="#0E1210" media="(prefers-color-scheme:dark)">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root,:root[data-theme=light]{
    color-scheme:light;
    --ground:#E7EBE7; --surf:#F8FAF8; --ink:#15201B; --ink2:#55625B; --line:#C0CAC3;
    --blue:#23417A; --blue-fg:#fff; --pine:#2F6B4F; --pine-fg:#fff;
    --ochre:#9A6410; --ochre-fg:#fff; --red:#9C3427; --red-fg:#fff;
    --bog:#EBD9B8; --bog-fg:#4A3405; --bog-bd:#D8BE8C;
    --bird:#AFCCF0; --bird-fg:#0F2A55; --bird-bd:#7FA5D8;
    --eag:#23417A; --eag-fg:#FFFFFF;
    --r:3px;
  }
  @media (prefers-color-scheme:dark){:root{
    color-scheme:dark;
    --ground:#0E1210; --surf:#242B26; --ink:#EDF2EE; --ink2:#A6B3AA; --line:#6E8075;
    --blue:#8FB0DE; --blue-fg:#0A1424; --pine:#6FBE93; --pine-fg:#0B1710;
    --ochre:#DCA648; --ochre-fg:#231702; --red:#E07A6B; --red-fg:#2A0C07;
    --bog:#7B6838; --bog-fg:#F5EACE; --bog-bd:#A08C58;
    --bird:#43659B; --bird-fg:#DCE8FA; --bird-bd:#6B8CC0;
    --eag:#8FB0DE; --eag-fg:#0A1424;
  }}
  :root[data-theme=dark]{
    color-scheme:dark;
    --ground:#0E1210; --surf:#242B26; --ink:#EDF2EE; --ink2:#A6B3AA; --line:#6E8075;
    --blue:#8FB0DE; --blue-fg:#0A1424; --pine:#6FBE93; --pine-fg:#0B1710;
    --ochre:#DCA648; --ochre-fg:#231702; --red:#E07A6B; --red-fg:#2A0C07;
    --bog:#7B6838; --bog-fg:#F5EACE; --bog-bd:#A08C58;
    --bird:#43659B; --bird-fg:#DCE8FA; --bird-bd:#6B8CC0;
    --eag:#8FB0DE; --eag-fg:#0A1424;
  }
  html{background:var(--ground);min-height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5;
    padding:0 0 calc(56px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto}
  .num{font-family:'Saira Condensed',sans-serif;font-weight:700;letter-spacing:.01em}
  .mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0;font-weight:600}
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:1px solid var(--line);
    background:var(--surf);color:var(--ink);border-radius:var(--r);padding:10px 8px;
    transition:none}
  button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  button.on{background:var(--ink);color:var(--surf);border-color:var(--ink)}
  button.on-pine{background:var(--pine);color:var(--pine-fg);border-color:var(--pine)}
  button.on-red{background:var(--red);color:var(--red-fg);border-color:var(--red)}
  button.on-ochre{background:var(--ochre);color:var(--ochre-fg);border-color:var(--ochre)}
  input,select{font-family:'IBM Plex Mono',monospace;font-size:16px;padding:9px 10px;
    border:1px solid var(--line);border-radius:var(--r);background:var(--surf);color:var(--ink);width:100%}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px}
  .wrap{padding:0 14px}
  header{padding:14px 14px 10px;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);font-weight:600}
  nav{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-bottom:1px solid var(--line);background:var(--surf)}
  nav button{border:0;border-right:1px solid var(--line);border-radius:0;padding:13px 4px;
    font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--ink2);background:var(--surf)}
  nav button:last-child{border-right:0}
  nav button.on{background:var(--ink);color:var(--surf)}
  .strip{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;margin:12px 0 4px}
  .cell{position:relative;aspect-ratio:1/1.15;border:1px solid var(--line);border-radius:2px;background:var(--surf);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;
    font-family:'IBM Plex Mono',monospace;color:var(--ink2);padding:0;min-width:0}
  .cell .st{position:absolute;top:0;right:2px;font-size:10px;line-height:1;font-weight:400;
    font-family:system-ui,-apple-system,sans-serif;pointer-events:none;
    text-shadow:0 0 2px var(--surf),0 0 2px var(--surf),0 0 2px var(--surf)}
  .cell .st.t1{color:var(--ink)}
  .cell .st.t2{color:inherit}
  .cell.cur{outline:2px solid var(--blue);outline-offset:1px}
  .cell.p{background:var(--surf);color:var(--ink2);border-style:dashed;border-color:var(--ink2)}
  .cell.e{background:var(--eag);color:var(--eag-fg);border-color:var(--eag)}
  .cell.bi{background:var(--bird);color:var(--bird-fg);border-color:var(--bird-bd)}
  .cell.g{background:var(--pine);color:var(--pine-fg);border-color:var(--pine)}
  .cell.b{background:var(--bog);color:var(--bog-fg);border-color:var(--bog-bd)}
  .cell.d{background:var(--red);color:var(--red-fg);border-color:var(--red)}
  .row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .row .lab{flex:0 0 66px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--ink2);font-weight:600}
  .seg{display:flex;gap:5px;flex:1}
  .seg button{flex:1;padding:12px 4px;font-size:13px;font-weight:500}
  .step{display:flex;align-items:center;gap:8px;flex:1}
  .step button{width:52px;height:48px;font-size:22px;line-height:1;padding:0}
  .step .val{flex:1;text-align:center;font-size:30px}
  .card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:10px 0}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:0}
  .kv b{font-family:'IBM Plex Mono',monospace;font-weight:500}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .met{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:10px}
  .met .v{font-family:'Saira Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1}
  .met .l{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-top:3px}
  .banner{border-left:3px solid var(--blue);background:var(--surf);padding:10px 12px;
    font-size:13px;margin:10px 0;border-radius:0}
  .banner.warn{border-left-color:var(--ochre)}
  .banner.bad{border-left-color:var(--red)}
  table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
  th{text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);
    font-family:'IBM Plex Sans',sans-serif;font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
  td{padding:6px 4px;border-bottom:1px solid var(--line)}
  .big{width:100%;padding:15px;font-size:14px;font-weight:600;letter-spacing:.04em;
    text-transform:uppercase;background:var(--ink);color:var(--surf);border-color:var(--ink);margin:8px 0}
  .ghost{background:var(--surf);color:var(--ink);border-color:var(--ink)}
  .quiet{background:var(--surf);color:var(--ink2);border-color:var(--line)}
  .hint{font-size:12px;color:var(--ink2);margin:5px 0 0}
  .hide{display:none}
  textarea{font-family:'IBM Plex Sans',sans-serif;font-size:16px;padding:9px 10px;width:100%;
    border:1px solid var(--line);border-radius:var(--r);background:var(--surf);color:var(--ink);min-height:90px}
  textarea:focus{outline:2px solid var(--blue);outline-offset:-1px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chips button{flex:0 0 auto;padding:9px 11px;font-size:13px}
  details summary{cursor:pointer;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;
    font-weight:600;color:var(--blue);padding:12px 0;list-style:none}
  details summary::-webkit-details-marker{display:none}
  .navrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 0}
  .navrow button{padding:15px;font-weight:600}
  .pill{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    font-weight:600;padding:3px 7px;border-radius:2px;background:var(--ground);color:var(--ink2)}
  @media (prefers-reduced-motion:no-preference){button{transition:background .1s}}

  .sec{border-top:2px solid var(--line);margin-top:14px}
  .sec-h{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);padding:10px 0 0}
  .sec-f{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:8px;padding:11px 10px;
    background:var(--surf)}
  .sec-f .lab{flex:0 0 66px;font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
  .sec-f .sum{flex:1;font-size:13px;color:var(--ink);line-height:1.35}
  .sec-f .ed{font-size:11px;color:var(--blue)}
  button.sug{border-style:dashed;border-color:var(--ink)}
  button.sugb{background:var(--bird);color:var(--bird-fg);border-color:var(--bird-bd)}
  .vb{flex:0 0 86px;padding:10px 10px;text-align:left;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:15px}
  .vb.kpon{outline:2px solid var(--blue);outline-offset:1px}
  .g9{display:grid;grid-template-columns:74px repeat(3,1fr);gap:5px;align-items:center}
  .g9 .gh{font-size:11px;color:var(--ink2);text-align:center}
  .g9 .gh.gr{text-align:left}
  .g9 .gh.gon{color:var(--ink);font-weight:600}
  .g9 button{height:46px;padding:0;font-size:12px;color:var(--ink2)}
  .g9 button.on-pine{color:var(--pine-fg);font-weight:600}
  .g9 button.on{color:var(--surf);font-size:22px}
  .kp-x{width:40px;height:36px;padding:0;font-size:16px}
  .g9 button.gc{border-width:2px}
  .g9 button.ga{border:2px dashed var(--blue);color:var(--blue);font-size:18px}
  .g9 button.on.ga{color:var(--surf)}
  .g9s button{height:34px}
  .g9 button.gp{background:var(--bird);color:var(--bird-fg);border:1px solid var(--bird-bd);font-size:16px}
  .g9 .g9x{height:46px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--pine);border:1px dashed var(--pine);border-radius:var(--r)}
  .kp{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surf);border-top:1px solid var(--line);
    padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
  .kp-in{max-width:520px;margin:0 auto}
  .kp-d{display:flex;align-items:baseline;gap:12px;padding:0 2px 8px}
  .kp-d .lab{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2)}
  .kp-v{font-size:34px;line-height:1;min-width:70px}
  .kp-k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .kp-k button{height:50px;font-size:22px}
  .kp-ok{width:100%;margin-top:6px;padding:14px;font-weight:600;background:var(--blue);border-color:var(--blue);color:var(--blue-fg)}
</style>

<header>
  <div class="eyebrow">Paces · Jan Sun</div>
  <h1 class="num" style="font-size:27px;line-height:1.1;margin-top:2px">10 → 5</h1>
  <div id="hdr" style="font-size:11.5px;font-weight:600;margin-top:4px">Paced, not guessed.</div>
</header>

<nav>
  <button id="t-play" class="on" onclick="go('play')">Play</button>
  <button id="t-practice" onclick="go('practice')">Practice</button>
  <button id="t-rounds" onclick="go('rounds')">Rounds</button>
  <button id="t-stats" onclick="go('stats')">Stats</button>
  <button id="t-data" onclick="go('data')">Data</button>
</nav>

<div id="errbox" class="wrap hide"></div>
<div id="v-play" class="wrap"></div>
<div id="v-practice" class="wrap hide"></div>
<div id="v-rounds" class="wrap hide"></div>
<div id="v-stats" class="wrap hide"></div>
<div id="v-data" class="wrap hide"></div>

<script>
const VER='3.2 \u00b7 21 Oct 2026';
function aimTick(on){const h=cur.holes[hole];mark('appD');
  if(on){h.aimOff=true;h.appD=null;h.appL=null;}
  else{h.aimOff=null;h.appD='pin';h.appL='ctr';}
  h.done=true;save();render();}
function puttHoled(){const h=cur.holes[hole];mark('putts');h.putts=1;h.fpD=null;h.fpL=null;h.done=true;save();render();}
function puttMiss(r,c){const h=cur.holes[hole];mark('fpD');
  if(h.fpD===r&&h.fpL===c&&h.putts>1){h.fpD=null;h.fpL=null;}
  else{h.fpD=r;h.fpL=c;if(h.putts<2)h.putts=2;}
  h.done=true;save();render();}
function puttGridHTML(h){
  if(!(h.putts>0))return '';
  var R=[['past','Past'],['hole','Hole high'],['short','Short']], C=[['high','High side'],['on','On line'],['low','Low side']], miss=h.putts>1;
  var s='<div class="g9"><span></span>'+C.map(function(c){return '<span class="gh '+(miss&&h.fpL===c[0]?'gon':'')+'">'+c[1]+'</span>';}).join('');
  R.forEach(function(r,i){ s+='<span class="gh gr '+(miss&&h.fpD===r[0]?'gon':'')+'">'+r[1]+'</span>';
    C.forEach(function(c,j){
      if(i===1&&j===1){ s+='<button class="'+(h.putts===1?'on-pine':'gc')+'" onclick="puttHoled()" aria-label="Holed">Holed</button>'; return; }
      var on=miss&&h.fpD===r[0]&&h.fpL===c[0];
      s+='<button class="'+(on?'on':'')+'" onclick="puttMiss(\''+r[0]+'\',\''+c[0]+'\')" aria-label="'+r[1]+', '+c[1]+'">'+(on?'\u25cf':'')+'</button>'; }); });
  return '<div style="padding:10px 0 4px">'+s+'</div><p class="hint" style="margin:6px 0 0">First putt. Holed sets one putt; a miss sets at least two \u2014 use + for a three-putt.</p>';}
function onOverride(h){return onGv(h)===true&&h.aimOff===true;}
let gMode='ball';
const GR=['Back','Middle','Front'], GC=['Left','Centre','Right'];
function pinRel(h){if(h.gPin==null||h.gBall==null)return '';
  var pr=Math.floor(h.gPin/3), br=Math.floor(h.gBall/3), pc=h.gPin%3, bc=h.gBall%3;
  var d=br<pr?'long':(br>pr?'short':''), l=bc<pc?'left':(bc>pc?'right':'');
  return (d||l)?('ball '+[d,l].filter(Boolean).join(' ')+' of pin'):'ball in the pin\u2019s third';}
function gTap(i){const h=cur.holes[hole];mark('appD');
  h.gBall=(h.gBall===i?null:i);
  h.done=true;save();render();}
function pinTap(i){const h=cur.holes[hole];mark('appD');
  h.gPin=(h.gPin===i?null:i);
  h.done=true;save();render();}
function pinLabel(h){if(h.gPin==null)return '';
  return 'pin '+['back','middle','front'][Math.floor(h.gPin/3)]+' '+['left','centre','right'][h.gPin%3];}
function pinPickHTML(h){
  var s='<div class="g9 g9s"><span></span>'+GC.map(function(c){return '<span class="gh">'+c+'</span>';}).join('');
  for(var r=0;r<3;r++){ s+='<span class="gh gr">'+GR[r]+'</span>';
    for(var c=0;c<3;c++){ var i=r*3+c, on=(h.gPin===i);
      s+='<button class="'+(on?'ga gp':'')+'" onclick="pinTap('+i+')" aria-label="Pin '+GR[r]+' '+GC[c]+'">'+(on?'\u2691':'')+'</button>'; } }
  s+='</div>';
  return '<div style="padding:10px 0 4px;border-bottom:1px solid var(--line)"><div style="font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);font-weight:600;margin-bottom:6px">Pin</div>'+s+
    '<p class="hint" style="margin:6px 0 0">Whole green in thirds, front = your side. Near a line, take the third the flag is in. Hazards don\u2019t move the pin.</p></div>';}
function greenGridHTML(h){
  var p=h.gPin, b=h.gBall, s='<div class="g9"><span></span>'+GC.map(function(c){return '<span class="gh">'+c+'</span>';}).join('');
  for(var r=0;r<3;r++){ s+='<span class="gh gr">'+GR[r]+'</span>';
    for(var c=0;c<3;c++){ var i=r*3+c, isP=(i===p), isB=(i===b);
      s+='<button class="'+(isB?'on ':'')+(isP?'ga':'')+'" onclick="gTap('+i+')" aria-label="'+GR[r]+' '+GC[c]+(isP?', pin':'')+(isB?', ball':'')+'">'+(isP?'\u2691':'')+(isB?'\u25cf':'')+'</button>'; } }
  s+='</div>';
  var step=(p==null)?'Set the <b>pin</b> above, then tap the ball.':(b==null?'Now tap where the <b>ball</b> \u25cf finished.':(function(t){return t.charAt(0).toUpperCase()+t.slice(1);})(pinRel(h))+'.');
  var mv='';
  return '<div style="padding:10px 0 4px">'+s+'<div style="display:flex;align-items:center;gap:8px;margin-top:6px"><p class="hint" style="margin:0;flex:1">The green in thirds. '+step+'</p>'+mv+'</div></div>';}
const CLUBS=['LW','SW','GW','PW','9i','8i','7i','6i','5i','4H','5W','3W','Dr'];
const PUTT_B=['0-1','2-3','4-6','7-10','11+'];
const BOOK_F=['tee','app','grn'];
const BOOK_L={tee:'Tee',app:'Approach',grn:'Green'};
function bookGet(course,hn){
  var c=(db.book||{})[course]||{}; var e=c[String(hn)]||{};
  return {tee:e.tee||'',app:e.app||'',grn:e.grn||''};}
function bookHas(course,hn){var e=bookGet(course,hn);
  return !!(e.tee||e.app||e.grn);}
function bookSet(course,hn,f,v,quiet){
  if(BOOK_F.indexOf(f)<0)return;
  if(!db.book)db.book={};
  if(!db.book[course])db.book[course]={};
  var k=String(hn);
  if(!db.book[course][k])db.book[course][k]={};
  db.book[course][k][f]=String(v==null?'':v).slice(0,300);
  if(!db.book[course][k][f])delete db.book[course][k][f];
  if(!Object.keys(db.book[course][k]).length)delete db.book[course][k];
  if(!quiet){save();render();}}
function bookSetCur(f,v){var h=cur.holes[hole];bookSet(cur.course,hno(h,hole),f,v);}
function bookPick(c){bookCourse=c;render();}
function fpBucket(n){n=+n; if(!isFinite(n)||n<0)return null;
  return n<=1?'0-1':(n<=3?'2-3':(n<=6?'4-6':(n<=10?'7-10':'11+')));}
function fpSet(v){const h=cur.holes[hole];
  var raw=String(v==null?'':v).replace(',','.').trim();
  if(raw===''){h.fpN=null; h.done=true; save(); render(); return;}
  var q=Math.round(parseFloat(raw));
  if(!isFinite(q)||q<0){h.done=true; save(); render(); return;}
  if(q>60)q=60;
  h.fpN=q; h.fp=fpBucket(q); h.done=true; save(); render();}
function noteSet(v){const h=cur.holes[hole];h.note=String(v==null?'':v).slice(0,400);
  h.done=true; save(); render();}
const KEY='golf:v1';
var STMODE='none';
var ST={
  get:function(k){
    if(window.storage&&window.storage.get)return window.storage.get(k);
    try{var v=localStorage.getItem(k);
      if(v===null)return Promise.reject(new Error('not found'));
      return Promise.resolve({key:k,value:v});}
    catch(e){return Promise.reject(e);}
  },
  set:function(k,v){
    if(window.storage&&window.storage.set)return window.storage.set(k,v);
    try{localStorage.setItem(k,v);return Promise.resolve({key:k,value:v});}
    catch(e){return Promise.reject(e);}
  }
};
function detectStore(){
  if(window.storage&&window.storage.set){STMODE='app';return;}
  try{localStorage.setItem('golf:probe','1');localStorage.removeItem('golf:probe');STMODE='browser';}
  catch(e){STMODE='none';}
}
const GENERIC=[4,4,3,5,4,4,4,3,5,4,4,5,4,3,4,4,3,5];
const CD={
 'Stolpe Ost':{par:[4,4,3,5,4,4,4,3,5,4,4,5,4,3,4,4,3,5],

function scoreCalc(h){if(!h||h.pu)return null; var og=onGv(h); if(og===null)return null;

  if(h.rec2!==true&&h.rec2!==false)return null;

function appPen(h){return !!h.pen&&!h.penTee;}
function shotNo(h){return h.appNo||autoNo(h);}
function onGv(h){return (h.onG===true||h.onG===false)?h.onG:(h.gir===true?true:null);}
function offGreen(h){return h.onG===false||((h.onG===null||h.onG===undefined)&&h.gir===false);}
function deriveGir(h){
  if(!h)return;
  if(h.onG===true&&appPen(h)){h.pen=null;h.penTee=null;}
  if(h.onG===null){h.gir=null;return;}
  if(h.onG!==true&&h.onG!==false)return;
  var n=shotNo(h);
  h.gir=h.onG?(n<=h.par-2):(h.rec2===false&&n+1<=h.par-2);
}
function kindSet(v){const h=cur.holes[hole];mark('appKind');h.appKind=v;if(v==='no')h.onG=false;h.done=true;save();render();}
function p5Set(v){const h=cur.holes[hole];mark('p5');
  if(h.p5===v){h.p5=null;}else{h.p5=v; if(v==='hit')h.onG=true; if(v==='miss')h.onG=false;}
  h.done=true;save();render();}
function penSet(v,isTee){const h=cur.holes[hole];kpCommit();liveSec=isTee?'tee':'app';
  if(h.pen===v&&(!!h.penTee)===isTee){h.pen=null;h.penTee=null;}
  else{h.pen=v;h.penTee=isTee?true:null;}
  h.done=true;save();render();}
function gridSet(fr,vr,fc,vc){const h=cur.holes[hole];mark(fr);
  if(h[fr]===vr&&h[fc]===vc){h[fr]=null;h[fc]=null;}else{h[fr]=vr;h[fc]=vc;}
  if(fr==='appD'&&onGv(h)===true&&(!h.appD||!h.appL)){h.appD='pin';h.appL='ctr';}
  h.done=true;save();render();}
function eqFlag(){const h=cur.holes[hole];mark('appDist');if(h.appFlag)h.appDist=String(h.appFlag);h.done=true;save();render();}
function greenSet(v){const h=cur.holes[hole];mark('onG');
  if(h.onG===v){h.onG=null;}
  else{h.onG=v;
    if(v){h.appD='pin';h.appL='ctr';h.aimOff=null;}
    else{if((h.appD==='pin'&&h.appL==='ctr')||h.aimOff){h.appD=null;h.appL=null;} h.gBall=null;h.aimOff=null;}}
  h.done=true;save();render();}
function goSec(k){kpCommit();keepAnchor(k);liveSec=k;render();}

/* keypad */
function kpOpen(f,chain){kpCommit();const h=cur.holes[hole];
  var v=f==='flag'?h.appFlag:(f==='play'?(h.appDist||(chain?h.appFlag:'')):(f==='fp'?(h.fpN==null?'':h.fpN):(pctOf(h)===null?'':pctOf(h))));
  kp={f:f,buf:String(v==null?'':v),fresh:!!chain&&String(v||'')!==''};var ks=(f==='fp')?'putt':'app';keepAnchor(ks,true);liveSec=ks;render();}
function kpNext(f){kpOpen(f,true);}
function kpCancel(){kp=null;render();}
function kpKey(k){if(!kp)return;
  if(kp.fresh){kp.fresh=false;kp.buf='';if(k==='neg'){kp.buf='-';render();return;}}
  kp.fresh=false;
  if(k==='del')kp.buf=kp.buf.slice(0,-1);
  else if(k==='neg')kp.buf=kp.buf.charAt(0)==='-'?kp.buf.slice(1):'-'+kp.buf;
  else if(kp.buf.replace('-','').length<3)kp.buf+=k;
  render();}
function kpCommit(){if(!kp)return;var k=kp;kp=null;const h=cur.holes[hole];
  if(k.f==='flag'){h.appFlag=k.buf;h.done=true;save();}
  else if(k.f==='play'){h.appDist=k.buf;h.done=true;save();}
  else if(k.f==='fp'){fpSet(k.buf);}
  else if(k.f==='pct'){pctSet(k.buf);}}
function kpDone(){kpCommit();render();}
function kpHTML(){if(!kp||RO)return '';const h=cur.holes[hole];
  var L={flag:['Flag','yds'],play:['Play to','yds'],pct:['Adjust','%'],fp:['1st putt','steps']}[kp.f];
  var extra='';
  if(kp.f==='pct'&&h.appFlag&&kp.buf&&isFinite(parseFloat(kp.buf)))
    extra='plays '+Math.round(+h.appFlag*(1+parseFloat(kp.buf)/100))+' y';
  if(kp.f==='fp'&&kp.buf!=='')extra='band '+fpBucket(+kp.buf);
  if(kp.f==='play'&&h.appFlag&&kp.buf!==''){var dd=+kp.buf-(+h.appFlag);extra=dd===0?'= flag':('adjust '+(dd>0?'+':'')+dd+' y');}
  var keys=['1','2','3','4','5','6','7','8','9',kp.f==='pct'?'neg':'',  '0','del'];
  return `<div class="kp" role="dialog" aria-label="${L[0]} entry">
    <div class="kp-in">
      <div class="kp-d"><span class="lab">${L[0]}</span><span class="num kp-v" style="${kp.fresh?'opacity:.5':''}">${esc(kp.buf)||'<span style="opacity:.3">0</span>'}</span>
        <span class="hint" style="margin:0;flex:1">${L[1]}${extra?' \u00b7 '+extra:''}</span>
        <button class="kp-x" onclick="kpCancel()" aria-label="Cancel without saving">\u2715</button></div>
      <div class="kp-k">${keys.map(k=>k===''?'<span></span>':
        `<button onclick="kpKey('${k}')">${k==='del'?'\u232b':(k==='neg'?'+/\u2212':k)}</button>`).join('')}</div>
      ${kp.f==='flag'
        ?`<div style="display:flex;gap:6px"><button class="kp-ok" style="flex:1" onclick="kpNext('play')">Play to yds</button><button class="kp-ok" style="flex:1" onclick="kpNext('pct')">\u00b1 %</button></div>`
        :`<button class="kp-ok" onclick="kpDone()">Done</button>`}
    </div></div>`;}
function vb(f,val,ph){return `<button class="vb ${kp&&kp.f===f?'kpon':''}" onclick="kpOpen('${f}')">${val!==''&&val!=null?esc(val):'<span style="opacity:.4">'+ph+'</span>'}</button>`;}

/* suggestions */
function clubMedians(){var t={};
  (db.rounds||[]).forEach(r=>(r.holes||[]).forEach(h=>{
    if(!h||!h.appClub||!atGreen(h)||h.appKind==='punch')return; var d=+h.appDist||0; if(!d)return;
    var k=h.appClub; t[k]=t[k]||{all:[],pin:[]}; t[k].all.push(d); if(h.appD==='pin'&&!h.appAlt)t[k].pin.push(d);}));
  var o={}; Object.keys(t).forEach(k=>{var a=(t[k].pin.length>=3?t[k].pin:t[k].all).slice().sort((x,y)=>x-y);
    if(a.length>=3)o[k]=a[Math.floor(a.length/2)];}); return o;}
function clubSuggest(h){var tg=+h.appDist||+h.appFlag||0; if(!tg)return null; var m=clubMedians(), best=null, bd=1e9;
  Object.keys(m).forEach(k=>{var d=Math.abs(m[k]-tg); if(d<bd){bd=d;best=k;}}); return bd<=12?best:null;}
function teeSuggest(h){var n=hno(h,hole), best=null, bd='';
  (db.rounds||[]).forEach(r=>{if(r.course!==cur.course||!r.holes)return;
    r.holes.forEach((x,i)=>{if(x&&x.teeClub&&hno(x,i)===n&&String(r.date||'')>=bd){bd=String(r.date||'');best=x.teeClub;}});});
  return best;}
function chip(f,v,label,cls,sug){const h=cur.holes[hole];
  return `<button class="${h[f]===v?(cls||'on'):''} ${sug&&h[f]!==v?(sug==='data'?'sugb':'sug'):''}" onclick="tog('${f}',${typeof v==='boolean'?v:"'"+v+"'"})">${label}</button>`;}

/* 3x3 grid */
function g9(fr,fc,rows,cols,rowL,colL,noCtr){const h=cur.holes[hole];
  let s=`<div class="g9"><span></span>${colL.map((c,j)=>`<span class="gh ${h[fc]===cols[j]?'gon':''}">${c}</span>`).join('')}`;
  rows.forEach((r,i)=>{s+=`<span class="gh gr ${h[fr]===r?'gon':''}">${rowL[i]}</span>`;
    cols.forEach((c,j)=>{const on=h[fr]===r&&h[fc]===c, ctr=(i===1&&j===1);
      if(ctr&&noCtr){s+='<span class="g9x">green</span>';return;}
      s+=`<button class="${on?(ctr?'on-pine':'on'):''} ${ctr?'gc':''}" aria-label="${rowL[i]}, ${colL[j]}"
        onclick="gridSet('${fr}','${r}','${fc}','${c}')">${on?'\u25cf':(ctr?'\u25cf':'')}</button>`;});});
  return s+'</div>';}

/* sections */
function secComplete(k,h){
  if(k==='tee')return !!h.tee&&!!h.teeClub;
  if(k==='p5')return !!h.p5;
  if(k==='app')return atGreen(h)?(!!h.appFlag&&!!h.appDist&&!!h.appClub&&onGv(h)!==null&&h.gPin!=null&&(onGv(h)===true?h.gBall!=null:(!!h.appD&&!!h.appL))):onGv(h)!==null;
  if(k==='off')return (h.ss===true||h.ss===false)&&!!h.rec&&(h.rec2===true||h.rec2===false);
  if(k==='putt')return !!h.pu||h.putts===0||((h.fpN!=null||!!h.fp)&&(h.putts<=1||(!!h.fpD&&!!h.fpL)));
  return false;}
function secList(h){var a=[]; if(h.par>3)a.push('tee'); if(h.par===5)a.push('p5'); a.push('app');
  if(offGreen(h)&&!appPen(h))a.push('off'); a.push('putt'); a.push('close'); return a;}
function focusSec(h){var L=secList(h); if(liveSec&&L.indexOf(liveSec)>=0)return liveSec;
  for(var i=0;i<L.length;i++)if(!secComplete(L[i],h))return L[i]; return 'close';}
function sec(k,title,summary,body){const h=cur.holes[hole];
  if(!RO&&secComplete(k,h)&&focusSec(h)!==k)
    return `<button class="sec-f" data-sec="${k}" onclick="goSec('${k}')"><span class="lab">${title}</span><span class="sum">${summary}</span><span class="ed">Edit</span></button>`;
  return `<section class="sec" data-sec="${k}"><div class="sec-h">${title}</div>${body}</section>`;}
const LBL={hit:'Fairway',L:'Left',R:'Right',other:'Other',OB:'OB',W:'Water',O:'Penalty',
  long:'long',pin:'pin high',short:'short',left:'left',ctr:'on line',right:'right',
  past:'past',hole:'hole high',high:'high side',on:'on line',low:'low side',
  chip:'Chip',pitch:'Pitch',bunker:'Bunker',putt:'Putted on'};
function lb(v){return LBL[v]||v;}

function holeScreenHTML(){
  const h=cur.holes[hole], n=cur.n;
  const sugC=RO?null:clubSuggest(h), sugT=RO?null:teeSuggest(h);
  const ag=atGreen(h), og=onGv(h);
  var out=`
  <div class="strip">${cur.holes.slice(0,9).map((x,i)=>cellHTML(x,i)).join('')}</div>
  ${n===18?`<div class="strip">${cur.holes.slice(9).map((x,i)=>cellHTML(x,i+9)).join('')}</div>`:''}
  ${RO?'':(function(){var c=starCount();var t=c[0]+c[1];return t?`<p class="hint" style="margin:2px 0 0;font-size:11px">
    <b>\u2605 ${t}</b> hole${t>1?'s':''} with gaps \u2014 tap to fill. Only holes you have touched are checked.</p>`:'';})()}
  ${(!RO&&cur.endAt)?`<div class="banner" style="margin:8px 0 0;display:flex;align-items:center;gap:8px">
    <span style="flex:1">Closing out after H${cur.endAt}.</span>
    <button style="padding:4px 9px;font-size:11px" onclick="finish()">Back to close-out</button></div>`:''}
  <div style="display:flex;align-items:baseline;gap:12px;margin:16px 0 6px">
    <div><div class="eyebrow">Hole</div><div class="num" style="font-size:46px;line-height:.9">${hno(h,hole)}</div></div>
    <div style="flex:1">
      <div class="eyebrow">Par</div>
      <div class="seg" ${RO?'style="pointer-events:none;opacity:.55"':''}>${[3,4,5].map(p=>`<button class="${h.par===p?'on':''}" onclick="setPar(${p})">${p}</button>`).join('')}</div>
    </div>
  </div>
  ${bookCardHTML(h)}
  <div ${RO?'style="pointer-events:none"':''}>`;

  /* TEE */
  if(h.par>3){
    out+=sec('tee','Tee',
      [lb(h.tee),h.teeClub,h.teeBk?'bunker':'',h.teeOut?'back in play':'',(h.pen&&h.penTee)?lb(h.pen):''].filter(Boolean).join(' \u00b7 '),
      `<div class="row"><div class="lab">Result</div><div class="seg">
        ${chip('tee','hit','Fairway','on-pine')}${chip('tee','L','Left','on-ochre')}${chip('tee','R','Right')}${chip('tee','other','Other')}
      </div></div>
      <div class="row" style="align-items:flex-start"><div class="lab" style="padding-top:9px">Club</div>
        <div class="chips" style="flex:1">${TEE_CLUBS.map(c=>chip('teeClub',c,c,null,c===sugT)).join('')}</div></div>
      ${h.tee&&h.tee!=='hit'?`<div style="padding:9px 0;border-bottom:1px solid var(--line)">
        <div class="chips">${chip('teeOut',true,'Next shot just back in play','on-ochre')}${chip('teeBk',true,'Bunker','on-ochre')}
          <button class="${h.pen&&h.penTee&&h.pen==='W'?'on-red':''}" onclick="penSet('W',true)">Water</button>
          <button class="${h.pen&&h.penTee&&h.pen==='O'?'on-red':''}" onclick="penSet('O',true)">Other penalty</button>
          <button class="${h.pen&&h.penTee&&h.pen==='OB'?'on-red':''}" onclick="penSet('OB',true)">OB</button></div>
        <p class="hint" style="margin:5px 0 0">Bunker = finished in sand, either side. Back in play = could not go at the green; the approach becomes shot #3.</p></div>`:''}`);
  }
  /* PAR 5 SECOND */
  if(h.par===5){
    out+=sec('p5','2nd shot',lb({hit:'Went · on green',miss:'Went · missed',lay:'Laid up',no:'Never on'}[h.p5]||''),
      `<div class="chips" style="padding:9px 0;border-bottom:1px solid var(--line)">
        ${['hit','miss','lay','no'].map((v,i)=>`<button class="${h.p5===v?['on-pine','on-ochre','on','on'][i]:''}" onclick="p5Set('${v}')">${['Went \u00b7 on green','Went \u00b7 missed','Laid up','Never on'][i]}</button>`).join('')}
      </div>`);
  }
  /* APPROACH */
  var appSum=ag
    ? [h.appClub, (h.appFlag||'?')+(h.appDist&&h.appDist!==h.appFlag?'\u2192'+h.appDist:'')+' y',
       (og===false&&(h.appD||h.appL))?[lb(h.appD),lb(h.appL)].filter(Boolean).join(' '):'',
       h.aimOff?'not where aimed':'', og===true?pinRel(h):pinLabel(h),
       og===true?'on green':(og===false?'off green':''), h.appAlt?'not stock':'', h.con?lb(h.con):'',
       appPen(h)?'penalty '+lb(h.pen):''].filter(Boolean).join(' \u00b7 ')
    : ['Never at it','shot '+shotNo(h),h.con?h.con:''].filter(Boolean).join(' \u00b7 ');
  var penRow=`<div class="row"><div class="lab">Penalty</div><div class="seg">
      ${[['OB','OB'],['W','Water'],['O','Other']].map(p=>`<button class="${h.pen===p[0]&&!h.penTee?'on-red':''}" onclick="penSet('${p[0]}',false)">${p[1]}</button>`).join('')}
    </div></div>
`;
  out+=sec('app','Approach',appSum,
    `${ag?'':`<div class="banner" style="margin:8px 0 0;display:flex;align-items:center;gap:8px"><span style="flex:1">Logged as never at the green (older entry).</span>
      <button style="padding:4px 9px;font-size:11px" onclick="kindSet('green')">Make it an approach</button></div>`}
    <div class="row"><div class="lab">Shot #</div><span class="hint" style="margin:0;flex:1">${h.appNo?'set by hand':'counted from par, tee and penalties'}</span>
      <div class="step" style="flex:0 0 auto;gap:4px"><button style="width:34px;height:42px;font-size:18px" onclick="bumpNo(-1)">\u2013</button>
        <div class="num" style="min-width:34px;text-align:center;font-size:20px" title="${h.appNo?'set by hand':'derived'}">#${shotNo(h)}</div>
        <button style="width:34px;height:42px;font-size:18px" onclick="bumpNo(1)">+</button></div></div>
    ${ag?`
    <div class="row"><div class="lab">Flag</div>${vb('flag',h.appFlag,'yds')}<span class="hint" style="margin:0">laser</span></div>
    <div class="row"><div class="lab">Play to</div>${vb('play',h.appDist,'yds')}
      <button class="${h.appFlag&&h.appDist&&h.appDist===String(h.appFlag)?'on':''}" style="padding:10px 11px" onclick="eqFlag()">= flag</button>
      ${vb('pct',pctOf(h)===null?'':((pctOf(h)>0?'+':'')+pctOf(h)+'%'),'\u00b1%')}</div>
    ${adj(h)!==null&&adj(h)!==0?`<p class="hint" style="margin:5px 0 4px;color:${Math.abs(adj(h))>=5?'var(--blue)':'var(--ink2)'}">Adjustment <b>${adj(h)>0?'+':''}${adj(h)} y</b></p>`:''}
    <div class="row" style="align-items:flex-start"><div class="lab" style="padding-top:9px">Club</div>
      <div class="chips" style="flex:1">${CLUBS.filter(c=>c!=='Dr').map(c=>chip('appClub',c,c,null,c===sugC?'data':false)).join('')}</div></div>
    ${(function(){var m=clubMedians(),n=Object.keys(m).length;
      if(!n)return '<p class="hint" style="margin:5px 0 0">No club log here yet, so nothing to highlight. Import your rounds in Data to test it.</p>';
      if(!(+h.appDist||+h.appFlag))return '<p class="hint" style="margin:5px 0 0">Enter a number and your club for it lights up blue.</p>';
      if(!sugC)return '<p class="hint" style="margin:5px 0 0">No club in your log within 12 y of this number.</p>';
      return '';})()}
    ${pinPickHTML(h)}
    <div class="row"><div class="lab">Finished</div><div class="seg">
      <button class="${og===true?'on-pine':''}" onclick="greenSet(true)">On the green</button>
      <button class="${og===false?'on':''}" onclick="greenSet(false)">Off the green</button></div></div>
    ${og===false?`<div style="padding:10px 0 4px">${g9('appD','appL',['long','pin','short'],['left','ctr','right'],['Long','Pin high','Short'],['Left','On line','Right'],true)}
      <p class="hint" style="margin:6px 0 0">Which way it missed the green, against <b>Play to</b> and your target line.</p></div>`
     :(og===true?`<div style="padding:9px 0 0"><div class="chips"><button class="${h.aimOff?'on-ochre':''}" onclick="aimTick(${h.aimOff?'false':'true'})">${h.aimOff?'\u2713 ':''}Not where I aimed</button></div>
         <p class="hint" style="margin:5px 0 0">${h.aimOff?'Counts as a miss of your target; no direction.':'Unticked = on number and on line.'}</p></div>${greenGridHTML(h)}`:'')}
    <div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div class="chips">${chip('appAlt',true,'Not a stock swing','on-ochre')}${chip('con','fat','Fat','on-red')}${chip('con','hosel','Hosel','on-red')}</div></div>`
    :`<p class="hint" style="margin:5px 0 4px">Event only \u2014 no numbers. Counts as off the green.</p>
    <div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div class="chips">${chip('con','fat','Fat','on-red')}${chip('con','hosel','Hosel','on-red')}</div></div>`}
    ${og===false?penRow:''}
    <p class="hint" style="margin:6px 0 0">GIR ${h.gir===true?'<b>yes</b>':(h.gir===false?'<b>no</b>':'\u2014')} \u00b7 worked out from where this shot finished and its shot number.</p>`);
  /* OFF THE GREEN */
  if(offGreen(h)&&!appPen(h)){
    out+=sec('off','Off the green',
      [h.ss===true?'Short-sided':(h.ss===false?'Room to work':''),lb(h.rec),h.rec2===true?'needed another':(h.rec2===false?'then on':'')].filter(Boolean).join(' \u00b7 '),
      `<div class="row"><div class="lab">Position</div><div class="seg">
        ${chip('ss',true,'Short-sided','on-red')}${chip('ss',false,'Room to work','on-pine')}</div></div>
      <p class="hint" style="margin:5px 0 0">Under ~8 m of green, or trouble on the line. Judge it <b>before</b> the recovery.</p>
      <div class="row" style="align-items:flex-start"><div class="lab" style="padding-top:9px">Recovery</div>
        <div class="chips" style="flex:1">${chip('rec','chip','Chip')}${chip('rec','pitch','Pitch')}${chip('rec','bunker','Bunker','on-ochre')}${chip('rec','putt','Putted on')}</div></div>
      <div class="row"><div class="lab">After it</div><div class="seg">
        ${chip('rec2',false,'On the green','on-pine')}${chip('rec2',true,'Needed another','on-red')}</div></div>
      <p class="hint" style="margin:5px 0 0">First recovery only. Where the ball <b>was</b>; fringe is not on.</p>`);
  }
  /* PUTTING */
  out+=sec('putt','Putting',
    [h.pu?'picked up':(h.putts+' putt'+(h.putts===1?'':'s')), h.fpN!=null?h.fpN+' steps':(h.fp?'band '+h.fp:''),
     (h.putts>1&&(h.fpD||h.fpL))?[lb(h.fpD),lb(h.fpL)].filter(Boolean).join(' '):''].filter(Boolean).join(' \u00b7 '),
    `<div class="row"><div class="lab">Putts</div><div class="step">
      <button onclick="bump('putts',-1)">\u2013</button><div class="val num">${h.putts}</div>
      <button onclick="bump('putts',1)">+</button></div></div>
    ${h.putts>0?`<div class="row"><div class="lab">1st putt</div>${vb('fp',h.fpN==null?'':h.fpN,'steps')}
      <span class="hint" style="margin:0">${h.fpN!=null?'band '+fpBucket(h.fpN):(h.fp?'band '+h.fp+' \u00b7 no number':'paced, round down')}</span></div>
    ${puttGridHTML(h)}`:''}`);
  /* CLOSE */
  out+=`<section class="sec" data-sec="close"><div class="row"><div class="lab">Score</div><div class="step">
    <button onclick="bump('score',-1)">\u2013</button><div class="val num">${h.score}</div>
    <button onclick="bump('score',1)">+</button></div></div>
  ${RO?'':(function(){if(h.pu)return ''; var c=scoreCalc(h);
    if(h.scoreAuto===true){
      if(!c)return '<p class="hint" style="margin:5px 0 0">Fills in by itself from shot number, green and putts.</p>';

function missList(x,t2){
  var a=[],b=[];
  if(!x||!x.done)return{a:a,b:b};
  if(x.scoreAuto===true){var sc=scoreCalc(x); if(sc&&sc.unsure)a.push('score check');}
  if(x.par>3&&!x.tee)a.push('tee result');
  if(x.par>3&&!x.teeClub)a.push('tee club');
  if(onGv(x)===null&&(x.gir===null||x.gir===undefined))a.push('on green');
  if(a.length)return{a:a,b:b};
  var T2=(t2===undefined)?(cur&&cur.tier2):t2;
  if(!T2)return{a:a,b:b};
  if(x.par===5&&!x.p5)b.push('par-5 2nd shot');
  if(atGreen(x)){
    if(!x.appFlag)b.push('flag');
    if(!x.appDist)b.push('play to');
    if(!x.appClub)b.push('approach club');
    if(onGv(x)!==true){ if(!x.appD)b.push('distance miss'); if(!x.appL)b.push('line miss'); }
    else if(x.gBall==null)b.push('ball on green');
    if(x.gPin==null&&(x.onG===true||x.onG===false))b.push('pin');
  }
  if(offGreen(x)&&!appPen(x)){
    if(x.ss===null||x.ss===undefined)b.push('position');
    if(!x.rec)b.push('recovery');
    if(x.rec2===null||x.rec2===undefined)b.push('after it');
  }
  if(!x.pu){
    if(!x.fp&&(x.fpN===null||x.fpN===undefined))b.push('1st putt');
    else if(x.putts>1){ if(!x.fpD)b.push('putt speed'); if(!x.fpL)b.push('putt line'); }
  }
  return{a:a,b:b};
}
function missTier(x,t2){var m=missList(x,t2);return m.a.length?1:(m.b.length?2:0);}
function starCount(){var a=0,b=0;(cur?cur.holes:[]).forEach(function(x){var m=missTier(x);

function vwRound(){return db.rounds.filter(function(r){return r.id===vwId;})[0]||null;}
function vwOpen(id){if(!db.rounds.some(function(r){return r.id===id;}))return;
  vwId=id; vwHole=0; armed=''; save(); render(); window.scrollTo(0,0);}
function vwClose(){vwId=null; vwHole=0; armed=''; save(); render(); window.scrollTo(0,0);}
function vwGo(i){var r=vwRound(); if(!r)return;
  vwHole=Math.max(0,Math.min(r.n-1,i)); save(); render(); window.scrollTo(0,0);}
function gaps(r){var a=0,b=0;(r.holes||[]).forEach(function(x){
  var m=missTier(x,r.tier2!==false); if(m===1)a++; else if(m===2)b++;});return[a,b];}
function vwSet(f,v){var r=vwRound(); if(!r)return;
  var old=(r[f]===undefined?null:r[f]);
  if(String(old===null?'':old)===String(v===null||v===undefined?'':v))return;
  (r.edits=r.edits||[]).push({f:f,from:old,to:v,at:new Date().toISOString().slice(0,16).replace('T',' ')});
  r[f]=v; save(); render();}
function vwTee(t){var r=vwRound(); if(!r)return;
  var T=CD[r.course]&&CD[r.course].tees[t];
  vwSet('tees',t); if(T){vwSet('cr',T[0]); vwSet('slope',T[1]);}}
function vwUndo(i){var r=vwRound(); if(!r||!r.edits||!r.edits[i])return;
  var e=r.edits[i]; r[e.f]=e.from; r.edits.splice(i,1);
  if(!r.edits.length)delete r.edits; armed=''; save(); render();}

function diffOf(r){
  if(!r.cr||!r.slope||r.n!==18)return null;
  if((r.holes||[]).some(function(h){return h.pu;}))return null;
  const s=r.holes.reduce((a,x)=>a+x.score,0);
  return Math.round((s-r.cr)*113/r.slope*10)/10;
}
function diff9(r){
  if(!r.cr||!r.slope||r.n!==9)return null;
  if((r.holes||[]).some(function(h){return h.pu;}))return null;
  var s=r.holes.reduce(function(a,x){return a+x.score},0);
  var d9=(s-r.cr/2)*113/r.slope;
  return {d9:Math.round(d9*10)/10, eq:Math.round(d9*20)/10};
}
function diffLabel(r){
  var d=diffOf(r); if(d!==null)return String(d);
  var n=diff9(r); if(n)return n.eq+'\u2248';
  return '\u2014';
}
function nineSplit(r){
  if(r.n!==18)return null;
  var f=r.holes.filter(function(h,i){return hno(h,i)<=9;});
  var b=r.holes.filter(function(h,i){return hno(h,i)>9;});
  if(f.length!==9||b.length!==9)return null;
  var ok=function(a){return a.every(function(h){return !h.pu;});};
  if(!ok(f)||!ok(b))return null;
  var tp=function(a){return a.reduce(function(x,h){return x+h.score-h.par},0);};
  return {f:tp(f),b:tp(b)};
}
function sum(r){
  const all=r.holes, hs=all.filter(x=>!x.pu);
  const score=hs.reduce((a,x)=>a+x.score,0),par=hs.reduce((a,x)=>a+x.par,0);
  const putts=hs.reduce((a,x)=>a+x.putts,0);
  const l45=all.filter(x=>x.par>3&&x.tee), fir=l45.filter(x=>x.tee==='hit').length;
  const gA=all.filter(x=>x.gir!==null), gH=gA.filter(x=>x.gir===true).length;
  return{score,par,putts,pu:all.length-hs.length,holed:hs.length,
    dbl:hs.filter(x=>x.score-x.par>=2).length,
    gir:gH,girN:gA.length,girPct:gA.length?Math.round(100*gH/gA.length):0,
    fir,firN:l45.length,firPct:l45.length?Math.round(100*fir/l45.length):0,
    pen:all.filter(x=>x.pen).length, ob:all.filter(x=>x.pen==='OB').length,
    birdie:hs.filter(x=>x.score<x.par).length,
    miss:hs.filter(x=>x.gir===false).length,
    ud:hs.filter(x=>x.gir===false&&x.putts===1).length,
    sand:hs.filter(x=>x.rec==='bunker').length,
    sandSave:hs.filter(x=>x.rec==='bunker'&&x.putts===1).length,
    chipN:hs.filter(x=>x.rec==='chip').length,
    chipUD:hs.filter(x=>x.rec==='chip'&&x.putts===1).length,
    pitchN:hs.filter(x=>x.rec==='pitch').length,
    pitchUD:hs.filter(x=>x.rec==='pitch'&&x.putts===1).length};
}

function renderStats(){
  const el=document.getElementById('v-stats'), R=db.rounds;
  if(!R.length){el.innerHTML=`<div class="banner">Stats unlock as rounds go in. Nothing to read yet.</div>`;return;}
  const S=R.map(sum), n=R.length;
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const per18=(v,r)=>v*18/r.n;
  // rates pool every hole; per-18 scoring uses full rounds only
  const girA=Math.round(100*S.reduce((a,s)=>a+s.gir,0)/Math.max(1,S.reduce((a,s)=>a+s.girN,0)));
  const firA=Math.round(100*S.reduce((a,s)=>a+s.fir,0)/Math.max(1,S.reduce((a,s)=>a+s.firN,0)));
  const R9=R.filter(r=>r.n>=9), S9=R9.map(sum);
  const complete=r=>!(r.holes||[]).some(h=>h.pu);
  const R18=R.filter(r=>r.n===18&&complete(r)), S18=R18.map(sum);
  const nPU=R.filter(r=>!complete(r)).length;
  const n9c=R.filter(r=>r.n===9).length, nOther=R.length-R18.length-n9c;
  const puttA=avg(S9.map((s,i)=>per18(s.putts,R9[i])));

  const birdA=avg(S9.map((s,i)=>per18(s.birdie,R9[i])));

  const AllA=R.flatMap(r=>r.holes).filter(h=>h.appD||h.appL);

  const nPunch=AllA.filter(h=>h.appKind==='punch').length;

  const fpN=Object.values(fp).reduce((a,b)=>a+b,0);

  const byClub={};
  AllA.filter(h=>h.appKind!=='punch').forEach(h=>{if(!h.appClub)return;const k=h.appClub;
    byClub[k]=byClub[k]||{n:0,d:[],pd:[],s:0,l:0};

  <p class="hint" style="margin:0 0 8px">${R18.length} full${n9c?' · '+n9c+' nine-hole':''}${nOther?' · '+nOther+' partial':''}${nPU?' · '+nPU+' with pick-ups':''}. Rates pool every hole logged. Average score uses complete 18-hole rounds only — a round with a pick-up has no gross score.</p>

  <div class="grid3">
    <div class="met"><div class="v">${R18.length?avg(S18.map(s=>s.score)).toFixed(1):'—'}</div><div class="l">Avg score · 18h</div></div>
    <div class="met"><div class="v">${girA}%</div><div class="l">GIR</div></div>
    <div class="met"><div class="v">${firA}%</div><div class="l">Fairway</div></div>
  </div>
  <div class="grid3">
    <div class="met"><div class="v">${puttA.toFixed(1)}</div><div class="l">Putts /18</div></div>
