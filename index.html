function diffOf(r){
  if(!r.cr||!r.slope||r.n!==18)return null;
  if((r.holes||[]).some(function(h){return h.pu;}))return null;
  const s=r.holes.reduce((a,x)=>a+x.score,0);
  return Math.round((s-r.cr)*113/r.slope*10)/10;
}
function diff9(r){
  if(!r.cr||!r.slope||r.n!==9)return null;
  if((r.holes||[]).some(function(h){return h.pu;}))return null;
  var s=r.holes.reduce(function(a,x){return a+x.score},0);
  var d9=(s-r.cr/2)*113/r.slope;
  return {d9:Math.round(d9*10)/10, eq:Math.round(d9*20)/10};
}
function diffLabel(r){
  var d=diffOf(r); if(d!==null)return String(d);
  var n=diff9(r); if(n)return n.eq+'\u2248';
  return '\u2014';
}
function nineSplit(r){
  if(r.n!==18)return null;
  var f=r.holes.filter(function(h,i){return hno(h,i)<=9;});
  var b=r.holes.filter(function(h,i){return hno(h,i)>9;});
  if(f.length!==9||b.length!==9)return null;
  var ok=function(a){return a.every(function(h){return !h.pu;});};
  if(!ok(f)||!ok(b))return null;
  var tp=function(a){return a.reduce(function(x,h){return x+h.score-h.par},0);};
  return {f:tp(f),b:tp(b)};
}
function sum(r){
  const all=r.holes, hs=all.filter(x=>!x.pu);
  const score=hs.reduce((a,x)=>a+x.score,0),par=hs.reduce((a,x)=>a+x.par,0);
  const putts=hs.reduce((a,x)=>a+x.putts,0);
  const l45=all.filter(x=>x.par>3&&x.tee), fir=l45.filter(x=>x.tee==='hit').length;
  const gA=all.filter(x=>x.gir!==null), gH=gA.filter(x=>x.gir===true).length;
  return{score,par,putts,pu:all.length-hs.length,holed:hs.length,
    dbl:hs.filter(x=>x.score-x.par>=2).length,
    gir:gH,girN:gA.length,girPct:gA.length?Math.round(100*gH/gA.length):0,
    fir,firN:l45.length,firPct:l45.length?Math.round(100*fir/l45.length):0,
    pen:all.filter(x=>x.pen).length, ob:all.filter(x=>x.pen==='OB').length,
    birdie:hs.filter(x=>x.score<x.par).length,
    miss:hs.filter(x=>x.gir===false).length,
    ud:hs.filter(x=>x.gir===false&&x.putts===1).length,
    sand:hs.filter(x=>x.rec==='bunker').length,
    sandSave:hs.filter(x=>x.rec==='bunker'&&x.putts===1).length,
    chipN:hs.filter(x=>x.rec==='chip').length,
    chipUD:hs.filter(x=>x.rec==='chip'&&x.putts===1).length,
    pitchN:hs.filter(x=>x.rec==='pitch').length,
    pitchUD:hs.filter(x=>x.rec==='pitch'&&x.putts===1).length};
}

/* ---------- STATS ---------- */
function renderStats(){
  const el=document.getElementById('v-stats'), R=db.rounds;
  if(!R.length){el.innerHTML=`<div class="banner">Stats unlock as rounds go in. Nothing to read yet.</div>`;return;}
  const S=R.map(sum), n=R.length;
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
  const per18=(v,r)=>v*18/r.n;
  // rates pool every hole; per-18 scoring uses full rounds only
  const girA=Math.round(100*S.reduce((a,s)=>a+s.gir,0)/Math.max(1,S.reduce((a,s)=>a+s.girN,0)));
  const firA=Math.round(100*S.reduce((a,s)=>a+s.fir,0)/Math.max(1,S.reduce((a,s)=>a+s.firN,0)));
  const R9=R.filter(r=>r.n>=9), S9=R9.map(sum);
  const complete=r=>!(r.holes||[]).some(h=>h.pu);
  const R18=R.filter(r=>r.n===18&&complete(r)), S18=R18.map(sum);
  const nPU=R.filter(r=>!complete(r)).length;
  const n9c=R.filter(r=>r.n===9).length, nOther=R.length-R18.length-n9c;
  const puttA=avg(S9.map((s,i)=>per18(s.putts,R9[i])));
  const dblA=avg(S9.map((s,i)=>per18(s.dbl,R9[i])));
  const birdA=avg(S9.map((s,i)=>per18(s.birdie,R9[i])));
  const obR=R.filter((r,i)=>S[i].ob>0).length;

  const AllA=R.flatMap(r=>r.holes).filter(h=>h.appD||h.appL);
  const A=AllA.filter(h=>h.appKind!=='punch'&&h.appKind!=='lay');
  const nPunch=AllA.filter(h=>h.appKind==='punch').length;
  const nLay=AllA.filter(h=>h.appKind==='lay').length;
  const nUnk=AllA.filter(h=>!h.appKind).length;
  const cD=k=>A.filter(h=>h.appD===k).length, cL=k=>A.filter(h=>h.appL===k).length;
  const sh=cD('short'),pin=cD('pin'),lo=cD('long');
  const le=cL('left'),ct=cL('ctr'),ri=cL('right');
  const hi=A.filter(h=>h.gir===true).length;
  const ratio=(a,b)=>b===0?(a===0?'—':a+':0'):(a/b).toFixed(1)+':1';

  const fp={};PUTT_B.forEach(b=>fp[b]=0);
  R.flatMap(r=>r.holes).forEach(h=>{if(h.fp)fp[h.fp]++});
  const fpN=Object.values(fp).reduce((a,b)=>a+b,0);

  const byClub={};
  AllA.filter(h=>h.appKind!=='punch').forEach(h=>{if(!h.appClub)return;const k=h.appClub;
    byClub[k]=byClub[k]||{n:0,d:[],pd:[],s:0,l:0};
    const dd=+h.appDist||0; byClub[k].n++;
    if(dd)byClub[k].d.push(dd);
    if(dd&&h.appD==='pin'&&!h.appAlt)byClub[k].pd.push(dd);
    if(h.appD==='short')byClub[k].s++; if(h.appD==='long')byClub[k].l++;});

  const wr=R.filter(r=>r.wristPost>1).length;

  el.innerHTML=`
  ${db.stride?'':`<div class="banner bad"><b>Stride still not calibrated.</b> Every pace bucket below is unitless. Twenty steps along a measured 20 m, once, in the Data tab.</div>`}
  ${n<20?`<div class="banner warn"><b>${n} of 20.</b> Sample too small to act on. Log, don't interpret.</div>`
        :`<div class="banner"><b>${n} rounds.</b> Sample is now readable.</div>`}
  <p class="hint" style="margin:0 0 8px">${R18.length} full${n9c?' · '+n9c+' nine-hole':''}${nOther?' · '+nOther+' partial':''}${nPU?' · '+nPU+' with pick-ups':''}. Rates pool every hole logged. Average score uses complete 18-hole rounds only — a round with a pick-up has no gross score.</p>

  <div class="grid3">
    <div class="met"><div class="v">${R18.length?avg(S18.map(s=>s.score)).toFixed(1):'—'}</div><div class="l">Avg score · 18h</div></div>
    <div class="met"><div class="v">${girA}%</div><div class="l">GIR</div></div>
    <div class="met"><div class="v">${firA}%</div><div class="l">Fairway</div></div>
  </div>
  <div class="grid3">
    <div class="met"><div class="v">${puttA.toFixed(1)}</div><div class="l">Putts /18</div></div>
    <div class="met"><div class="v" style="color:${dblA>1.5?'var(--red)':'inherit'}">${dblA.toFixed(1)}</div><div class="l">Doubles+ /18</div></div>
    <div class="met"><div class="v">${birdA.toFixed(1)}</div><div class="l">Birdies /18</div></div>
  </div>

  <h3 class="eyebrow" style="margin:20px 0 0">Watch metrics</h3>
  <p class="hint" style="margin:2px 0 8px">Categorical, so measurement error can't touch them. These carry the diagnosis.</p>
  ${A.length<60?`<div class="banner">${A.length} of ~60 approaches at the green. Roughly four rounds now that both axes log on every shot.</div>`:''}
  ${(nPunch||nLay)?`<p class="hint" style="margin:0 0 8px">Excluded from the two ratios: ${nLay} lay-up${nLay===1?'':'s'} and ${nPunch} punch-out${nPunch===1?'':'s'}.${nUnk?` ${nUnk} older shots carry no kind flag and are still counted as approaches \u2014 treat the ratio as contaminated until that number stops growing.`:''}</p>`
    :(nUnk?`<p class="hint" style="margin:0 0 8px">${nUnk} approaches carry no shot-kind flag. Any punch-out or reload among them is inflating the short count.</p>`:'')}
  <div class="grid2">
    <div class="met"><div class="v" style="color:${sh/Math.max(1,lo)>1.5?'var(--red)':'var(--pine)'}">${ratio(sh,lo)}</div>
      <div class="l">Short : long</div></div>
    <div class="met"><div class="v" style="color:${le/Math.max(1,ri)>1.5?'var(--red)':'var(--pine)'}">${ratio(le,ri)}</div>
      <div class="l">Left : right</div></div>
  </div>
  <div class="card"><div class="kv"><span>Greens hit on approach</span><b>${A.length?Math.round(100*hi/A.length):0}%</b></div>
    <div class="kv"><span>Short / on number / long</span><b>${sh} · ${pin} · ${lo}</b></div>
    <div class="kv"><span>Left / on line / right</span><b>${le} · ${ct} · ${ri}</b></div>
    <div class="kv"><span>Hit your number</span><b>${A.length?Math.round(100*pin/A.length):0}%</b></div>
    <div class="kv"><span>Up and down</span><b>${S.reduce((a,s)=>a+s.miss,0)?Math.round(100*S.reduce((a,s)=>a+s.ud,0)/S.reduce((a,s)=>a+s.miss,0))+'%':'—'} (${S.reduce((a,s)=>a+s.ud,0)}/${S.reduce((a,s)=>a+s.miss,0)})</b></div>
    <div class="kv"><span>&nbsp;&nbsp;from a chip</span><b>${S.reduce((a,s)=>a+s.chipN,0)?S.reduce((a,s)=>a+s.chipUD,0)+' of '+S.reduce((a,s)=>a+s.chipN,0):'—'}</b></div>
    <div class="kv"><span>&nbsp;&nbsp;from a pitch</span><b>${S.reduce((a,s)=>a+s.pitchN,0)?S.reduce((a,s)=>a+s.pitchUD,0)+' of '+S.reduce((a,s)=>a+s.pitchN,0):'—'}</b></div>
    <div class="kv"><span>&nbsp;&nbsp;from a bunker</span><b>${S.reduce((a,s)=>a+s.sand,0)?S.reduce((a,s)=>a+s.sandSave,0)+' of '+S.reduce((a,s)=>a+s.sand,0):'—'}</b></div>
    <div class="kv"><span>Rounds with an OB</span><b>${obR} of ${n}</b></div>
    <div class="kv"><span>Rounds with wrist soreness+</span><b>${wr} of ${n}</b></div></div>

  ${ssBlock(R)}

  ${adjBlock(R)}

  ${bagBlock(R)}

  ${teeBlock(R)}

  ${loadBlock()}

  ${Object.keys(byClub).length?`
  <h3 class="eyebrow" style="margin:20px 0 6px">Club log · your real carry chart</h3>
  <table><thead><tr><th>Club</th><th>n</th><th>Plays</th><th>True</th><th>Short</th></tr></thead><tbody>
  ${CLUBS.filter(k=>byClub[k]).map(k=>{const b=byClub[k];
    const d=b.d.slice().sort((x,y)=>x-y), pd=b.pd.slice().sort((x,y)=>x-y);
    const med=d.length?d[Math.floor(d.length/2)]:'—';
    const carry=pd.length>=3?pd[Math.floor(pd.length/2)]:'—';
    return `<tr><td><b>${k}</b></td><td>${b.n}</td><td>${med}</td>
      <td><b>${carry}</b></td>
      <td style="color:${b.s/b.n>.35?'var(--red)':'inherit'}">${Math.round(100*b.s/b.n)}%</td></tr>`;}).join('')}
  </tbody></table>
  <p class="hint"><b>Plays</b> is the median number you choose with that club — what you currently believe. <b>True</b> is the median of stock swings that came out on your number, and appears once a club has three. If Plays sits above True you are clubbing yourself short. If True never appears at all, no shot with that club has come out right and the number in your head is wrong.</p>`:''}

  ${fpN?`<h3 class="eyebrow" style="margin:20px 0 6px">First putt · paced steps</h3>
  <div class="card">${PUTT_B.map(b=>{
    const hs=R.flatMap(r=>r.holes).filter(h=>h.fp===b&&!h.pu);
    const made=hs.filter(h=>h.putts===1).length, three=hs.filter(h=>h.putts>=3).length;
    return `<div class="kv"><span>${b} steps &nbsp;<span style="color:var(--ink2)">n=${hs.length}</span></span><b>${hs.length?Math.round(100*made/hs.length)+'% made':'—'}${three?' · '+three+' three-putt':''}</b></div>`;}).join('')}</div>
  <p class="hint">Bucket edges sit where make rate roughly halves, so 4-6 and 7-10 are genuinely different skills. Needs ~10 rounds per bucket.</p>`:''}

  ${puttMissBlock(R)}

  ${par5Block(R)}

  <p class="hint" style="margin:18px 0 4px">Build ${VER}</p>`;
}

function ssBlock(R){
  var MS=R.flatMap(function(r){return r.holes}).filter(function(h){return h.gir===false&&!h.pu;});
  var L=MS.filter(function(h){return h.ss===true||h.ss===false;});
  if(!L.length)return '';
  var SS=L.filter(function(h){return h.ss===true;}), RM=L.filter(function(h){return h.ss===false;});
  var pct=function(a,b){return b?Math.round(100*a/b)+'%':'\u2014';};
  var ud=function(g){return g.filter(function(h){return h.putts===1;}).length;};
  var dbl=function(g){return g.filter(function(h){return h.score-h.par>=2;}).length;};
  var unlogged=MS.length-L.length;
  var rate=L.length?SS.length/L.length:0;
  var cnt=function(g,f,v){return g.filter(function(h){return h[f]===v;}).length;};
  var dirRow=function(g,lab){
    if(!g.length)return '';
    return '<tr><td><b>'+lab+'</b></td><td>'+g.length+'</td>'+
      '<td>'+cnt(g,'appD','short')+'</td><td>'+cnt(g,'appD','long')+'</td>'+
      '<td>'+cnt(g,'appL','left')+'</td><td>'+cnt(g,'appL','right')+'</td></tr>';};
  var dirs=dirRow(SS,'Short-sided')+dirRow(RM,'Room');
  return '<h3 class="eyebrow" style="margin:20px 0 6px">Green misses \u00b7 short-sided</h3>'+
  '<div class="grid3">'+
    '<div class="met"><div class="v" style="color:'+(rate>0.4?'var(--red)':(rate>0.3?'var(--ochre)':'var(--pine)'))+'">'+
      pct(SS.length,L.length)+'</div><div class="l">Short-sided</div></div>'+
    '<div class="met"><div class="v">'+pct(ud(SS),SS.length)+'</div><div class="l">Up&amp;down \u00b7 short-sided</div></div>'+
    '<div class="met"><div class="v">'+pct(ud(RM),RM.length)+'</div><div class="l">Up&amp;down \u00b7 room</div></div>'+
  '</div>'+
  '<div class="card">'+
    '<div class="kv"><span>Green misses with a position logged</span><b>'+L.length+' of '+MS.length+
      (unlogged?' <span style="color:var(--ochre)">('+unlogged+' blank)</span>':'')+'</b></div>'+
    '<div class="kv"><span>Short-sided / room to work</span><b>'+SS.length+' \u00b7 '+RM.length+'</b></div>'+
    '<div class="kv"><span>Up and down \u2014 short-sided</span><b>'+ud(SS)+' of '+SS.length+'</b></div>'+
    '<div class="kv"><span>Up and down \u2014 room to work</span><b>'+ud(RM)+' of '+RM.length+'</b></div>'+
    '<div class="kv"><span>Doubles+ \u2014 short-sided</span><b style="color:'+(dbl(SS)?'var(--red)':'inherit')+'">'+
      dbl(SS)+' ('+pct(dbl(SS),SS.length)+')</b></div>'+
    '<div class="kv"><span>Doubles+ \u2014 room to work</span><b>'+dbl(RM)+' ('+pct(dbl(RM),RM.length)+')</b></div>'+
  '</div>'+
  (dirs?'<table><thead><tr><th>Position</th><th>n</th><th>app short</th><th>long</th><th>left</th><th>right</th></tr></thead><tbody>'+
    dirs+'</tbody></table>'+
    '<p class="hint">This table decides which project the short-siding belongs to. If short-sided misses are mostly <b>app short</b>, the approach is coming up short into front pins and the fix is clubbing \u2014 no aiming change would have helped. If they are mostly <b>left</b> or <b>right</b>, you aimed at flags and the fix is centre of green. Aggregate rate alone cannot tell those apart, and they need opposite work.</p>':'')+
  '<p class="hint">Short-sided is roughly a 10\u201315% up-and-down proposition against 30\u201335% with room \u2014 call it two strokes a round between an all-short-sided and an all-room round, which is a large share of the 10\u21925 gap. It is also decided entirely at club selection, so it moves without a swing change. Compare the two up-and-down figures above once both have about 25 events: if they come out equal, the position is not costing you what theory says and this field retires.</p>';
}

function adjBlock(R){
  var A=R.flatMap(function(r){return r.holes}).filter(function(h){
    return atGreen(h)&&(h.appD||h.appL);});
  if(!A.length)return '';
  var both=A.filter(function(h){return adj(h)!==null;});
  var pct=function(a,b){return b?Math.round(100*a/b)+'%':'\u2014';};
  var cnt=function(g,v){return g.filter(function(h){return h.appD===v;}).length;};
  var med=function(a){if(!a.length)return null;var s=a.slice().sort(function(x,y){return x-y});
    return s[Math.floor(s.length/2)];};
  var BANDS=[[0,130,'\u2264130'],[131,155,'131\u2013155'],[156,175,'156\u2013175'],[176,999,'176+']];
  var bandRows=function(field,label){
    var rows=BANDS.map(function(b){
      var g=A.filter(function(h){var d=+h[field]||0;return d>0&&d>=b[0]&&d<=b[1];});
      if(!g.length)return '';
      var s=cnt(g,'short'),p=cnt(g,'pin'),l=cnt(g,'long');
      return '<tr><td><b>'+b[2]+'</b></td><td>'+g.length+'</td>'+
        '<td style="color:'+(s/Math.max(1,l)>1.5&&g.length>=6?'var(--red)':'inherit')+'">'+s+'</td>'+
        '<td>'+p+'</td><td>'+l+'</td>'+
        '<td>'+(l===0?(s?s+':0':'\u2014'):(s/l).toFixed(1)+':1')+'</td></tr>';}).join('');
    if(!rows)return '';
    var cov=A.filter(function(h){return (+h[field]||0)>0;}).length;
    return '<p class="hint" style="margin:14px 0 4px"><b>'+label+'</b> \u2014 '+cov+' of '+A.length+' approaches carry this number</p>'+
      '<table><thead><tr><th>Band (y)</th><th>n</th><th>short</th><th>on</th><th>long</th><th>S:L</th></tr></thead><tbody>'+
      rows+'</tbody></table>';};
  var adjs=both.map(adj);
  var moved=both.filter(function(h){return Math.abs(adj(h))>=5;});
  var flat=both.filter(function(h){return Math.abs(adj(h))<5;});
  var up=both.filter(function(h){return adj(h)>=5;});
  return '<h3 class="eyebrow" style="margin:20px 0 6px">Flag vs play number</h3>'+
  '<div class="grid3">'+
    '<div class="met"><div class="v">'+both.length+'</div><div class="l">Both numbers</div></div>'+
    '<div class="met"><div class="v">'+(med(adjs)===null?'\u2014':(med(adjs)>0?'+':'')+med(adjs))+'</div><div class="l">Median adj (y)</div></div>'+
    '<div class="met"><div class="v">'+pct(moved.length,both.length)+'</div><div class="l">Adjusted \u22655 y</div></div>'+
  '</div>'+
  '<div class="card">'+
    '<div class="kv"><span>Approaches with a flag number</span><b>'+both.length+' of '+A.length+
      ((A.length-both.length)?' <span style="color:var(--ochre)">('+(A.length-both.length)+' play-to only)</span>':'')+'</b></div>'+
    '<div class="kv"><span>Adjusted up \u2014 short / on / long</span><b>'+cnt(up,'short')+' \u00b7 '+cnt(up,'pin')+' \u00b7 '+cnt(up,'long')+'</b></div>'+
    '<div class="kv"><span>No adjustment \u2014 short / on / long</span><b>'+cnt(flat,'short')+' \u00b7 '+cnt(flat,'pin')+' \u00b7 '+cnt(flat,'long')+'</b></div>'+
  '</div>'+
  '<p class="hint">Two rows, one question. If shots you <b>adjusted up</b> still come out short at the same rate as shots you did not adjust, the adjustment is systematically undersized and the fix is arithmetic \u2014 stack wind, elevation and lie instead of picking one. If only the unadjusted row runs short, you are failing to adjust at all when you should. If both rows sit level, the number is fine and the miss is contact.</p>'+
  bandRows('appDist','Bands on your play-to number \u2014 did you hit what you tried to hit')+
  bandRows('appFlag','Bands on the raw flag number \u2014 same shots, other definition')+
  '<p class="hint">The 155 y weak band was derived before these were separate fields, so it currently rests on a mixed variable. If the short bias starts in a different row on each table, the threshold is defined on the wrong number and every club decision built on it needs redoing. Only the flag table can be built from here on \u2014 older rounds have no flag number and are absent from it, so ignore that table until its n approaches the other one.</p>';
}

function puttMissBlock(R){
  var H=R.flatMap(function(r){return r.holes}).filter(function(h){
    return !h.pu&&h.putts>1&&(h.fpD||h.fpL);});
  if(!H.length)return '';
  var c=function(f,v,set){return (set||H).filter(function(h){return h[f]===v}).length;};
  var pct=function(a,b){return b?Math.round(100*a/b)+'%':'\u2014';};
  var rows=PUTT_B.map(function(b){
    var g=H.filter(function(h){return h.fp===b;});
    if(!g.length)return '';
    var all=R.flatMap(function(r){return r.holes}).filter(function(h){return h.fp===b&&!h.pu;});
    return '<tr><td><b>'+b+'</b></td><td>'+g.length+'</td>'+
      '<td style="color:'+(c('fpD','short',g)/g.length>0.4?'var(--red)':'inherit')+'">'+pct(c('fpD','short',g),g.length)+'</td>'+
      '<td>'+pct(c('fpD','past',g),g.length)+'</td>'+
      '<td style="color:'+(c('fpL','low',g)/g.length>0.4?'var(--red)':'inherit')+'">'+pct(c('fpL','low',g),g.length)+'</td>'+
      '<td>'+pct(c('fpL','on',g),g.length)+'</td>'+
      '<td>'+pct(all.filter(function(h){return h.putts===1}).length,all.length)+'</td></tr>';
  }).join('');
  var gir=H.filter(function(h){return h.gir===true;}), rec=H.filter(function(h){return h.gir===false;});
  return '<h3 class="eyebrow" style="margin:20px 0 6px">First putt \u00b7 why it missed</h3>'+
  '<div class="grid2">'+
    '<div class="met"><div class="v" style="color:'+(c('fpD','short')/Math.max(1,c('fpD','past'))>1.5?'var(--red)':'var(--pine)')+'">'+
      (c('fpD','past')===0?(c('fpD','short')+':0'):(c('fpD','short')/c('fpD','past')).toFixed(1)+':1')+'</div><div class="l">Short : past</div></div>'+
    '<div class="met"><div class="v" style="color:'+(c('fpL','low')/Math.max(1,c('fpL','high'))>1.5?'var(--red)':'var(--pine)')+'">'+
      (c('fpL','high')===0?(c('fpL','low')+':0'):(c('fpL','low')/c('fpL','high')).toFixed(1)+':1')+'</div><div class="l">Low : high side</div></div>'+
  '</div>'+
  '<div class="card">'+
    '<div class="kv"><span>Misses logged</span><b>'+H.length+'</b></div>'+
    '<div class="kv"><span>Short / hole high / past</span><b>'+c('fpD','short')+' \u00b7 '+c('fpD','hole')+' \u00b7 '+c('fpD','past')+'</b></div>'+
    '<div class="kv"><span>High / on line / low</span><b>'+c('fpL','high')+' \u00b7 '+c('fpL','on')+' \u00b7 '+c('fpL','low')+'</b></div>'+
    '<div class="kv"><span>Speed-only misses (on line)</span><b>'+pct(c('fpL','on'),H.length)+'</b></div>'+
    '<div class="kv"><span>Missed after a GIR</span><b>'+gir.length+'</b></div>'+
    '<div class="kv"><span>Missed after a recovery</span><b>'+rec.length+'</b></div>'+
  '</div>'+
  (rows?'<table><thead><tr><th>Steps</th><th>miss n</th><th>short</th><th>past</th><th>low</th><th>on line</th><th>made</th></tr></thead><tbody>'+rows+'</tbody></table>':'')+
  '<p class="hint">Read the 2-3 and 4-6 rows first. If <b>short</b> and <b>on line</b> both run high, the stroke is fine and the read is fine \u2014 you are leaving it short of the hole, which is a speed calibration problem and the cheapest thing on this page to fix. If <b>low</b> runs high instead, it is an aim or read problem and needs a different practice block. The two demand opposite work, which is why the miss was worth logging.</p>';
}

function par5Block(R){
  var P=R.flatMap(function(r){return r.holes}).filter(function(h){return h.par===5&&h.p5;});
  if(!P.length)return '';
  var g=function(k){return P.filter(function(h){return h.p5===k;});};
  var hit=g('hit'), miss=g('miss'), lay=g('lay'), no=g('no');
  var went=hit.length+miss.length;
  var toPar=function(a){var s=a.filter(function(h){return !h.pu;});
    if(!s.length)return '\u2014';
    var d=s.reduce(function(x,h){return x+h.score-h.par},0)/s.length;
    return (d>=0?'+':'')+d.toFixed(2);};
  var brd=function(a){var s=a.filter(function(h){return !h.pu;});
    return s.length?Math.round(100*s.filter(function(h){return h.score<h.par}).length/s.length)+'%':'\u2014';};
  return '<h3 class="eyebrow" style="margin:20px 0 6px">Par 5 \u00b7 the second shot</h3>'+
  '<div class="grid3">'+
    '<div class="met"><div class="v">'+(P.length?Math.round(100*went/P.length)+'%':'\u2014')+'</div><div class="l">Went for it</div></div>'+
    '<div class="met"><div class="v">'+(went?Math.round(100*hit.length/went)+'%':'\u2014')+'</div><div class="l">Found green</div></div>'+
    '<div class="met"><div class="v">'+P.length+'</div><div class="l">Par 5s logged</div></div>'+
  '</div>'+
  '<table><thead><tr><th>2nd shot</th><th>n</th><th>vs par</th><th>birdie</th></tr></thead><tbody>'+
    [['Went \u00b7 on green',hit],['Went \u00b7 missed',miss],['Laid up',lay],['Never on',no]]
      .filter(function(x){return x[1].length;})
      .map(function(x){return '<tr><td><b>'+x[0]+'</b></td><td>'+x[1].length+'</td><td>'+toPar(x[1])+'</td><td>'+brd(x[1])+'</td></tr>';}).join('')+
  '</tbody></table>'+
  '<p class="hint">Every birdie you have has come from a wedge third. This table is the test of whether going for it in two actually pays, and the honest comparison is <b>Went \u00b7 missed</b> against <b>Laid up</b> \u2014 not the on-green row, which is selected on success. Needs roughly ten in each row before it decides anything.</p>';
}

function bagBlock(R){
  var G={};
  R.forEach(function(r){
    if(!r.carry)return;
    var k=r.carry, sp=nineSplit(r), s=sum(r);
    G[k]=G[k]||{n:0,f:0,b:0,nSplit:0,gir:0,girN:0};
    G[k].n++; G[k].gir+=s.gir; G[k].girN+=s.girN;
    if(sp){G[k].nSplit++; G[k].f+=sp.f; G[k].b+=sp.b;}
  });
  var LB={carry:'Carried',trolley:'Push cart',cart:'Buggy'};
  var keys=['carry','trolley','cart'].filter(function(k){return G[k];});
  if(!keys.length)return '';
  return `
  <h3 class="eyebrow" style="margin:20px 0 6px">Bag</h3>
  <table><thead><tr><th>Method</th><th>n</th><th>Front</th><th>Back</th><th>Drift</th><th>GIR</th></tr></thead><tbody>
  ${keys.map(function(k){var b=G[k];
    var f=b.nSplit?(b.f/b.nSplit):null, bk=b.nSplit?(b.b/b.nSplit):null;
    var dr=(f===null)?null:(bk-f);
    return `<tr><td><b>${LB[k]}</b></td><td>${b.n}</td>
      <td>${f===null?'—':(f>=0?'+':'')+f.toFixed(1)}</td>
      <td>${bk===null?'—':(bk>=0?'+':'')+bk.toFixed(1)}</td>
      <td style="color:${dr!==null&&dr>1?'var(--red)':'inherit'}">${dr===null?'—':(dr>=0?'+':'')+dr.toFixed(1)}</td>
      <td>${b.girN?Math.round(100*b.gir/b.girN)+'%':'—'}</td></tr>`;}).join('')}
  </tbody></table>
  <p class="hint"><b>Drift</b> is back nine minus front nine relative to par. If carrying costs you late in the round, that is where it shows — not in the total. Needs about five rounds per method.</p>`;
}

function teeBlock(R){
  const T={}; R.flatMap(r=>r.holes).forEach(h=>{
    if(h.par<=3||!h.teeClub)return; const k=h.teeClub;
    T[k]=T[k]||{n:0,fw:0,pen:0,ob:0,dbl:0,out:0};
    T[k].n++; if(h.tee==='hit')T[k].fw++; if(h.teeOut)T[k].out++;
    if(h.pen&&h.penTee)T[k].pen++; if(h.pen==='OB'&&h.penTee)T[k].ob++;
    if(h.tee&&h.tee!=='hit'&&!h.pu&&h.score-h.par>=2)T[k].dbl++;});
  const keys=TEE_CLUBS.filter(k=>T[k]);
  if(!keys.length)return '';
  return `
  <h3 class="eyebrow" style="margin:20px 0 6px">Tee club</h3>
  <table><thead><tr><th>Club</th><th>n</th><th>Fairway</th><th>Blocked</th><th>Pen</th><th>Cost</th></tr></thead><tbody>
  ${keys.map(k=>{const b=T[k];return `<tr><td><b>${k}</b></td><td>${b.n}</td>
    <td>${Math.round(100*b.fw/b.n)}%</td>
    <td style="color:${b.out/b.n>0.15?'var(--red)':'inherit'}">${Math.round(100*b.out/b.n)}%</td>
    <td style="color:${b.pen?'var(--ochre)':'inherit'}">${b.pen}${b.ob?' ('+b.ob+' OB)':''}</td>
    <td style="color:${b.dbl/b.n>0.2?'var(--red)':'inherit'}">${b.dbl}</td></tr>`;}).join('')}
  </tbody></table>
  <p class="hint"><b>Blocked</b> is the share of tee shots after which you could not go at the green — the difference between a miss and a real miss. <b>Pen</b> counts only penalties off the tee. <b>Cost</b> counts doubles-or-worse only where the tee shot missed the fairway. Fairway rate alone will flatter your driver; Blocked is the column that decides whether it is worth hitting.</p>`;
}

function loadBlock(){
  const SS=db.sessions||[]; if(!SS.length&&!db.rounds.length)return '';
  const day=86400000, now=Date.now();
  const inWin=(d,n)=>{const t=Date.parse(d); return !isNaN(t)&&(now-t)<=n*day;};
  const swingsOf=r=>{let t=0;(r.holes||[]).forEach(h=>{t+=(+h.score||0)-(+h.putts||0);});
    return Math.max(0,t)+(+(r.wuBalls||r.warmup)||0);};
  const swingsIn=n=>SS.filter(x=>inWin(x.date,n)).reduce((a,x)=>a+(+x.balls||0),0)
    + db.rounds.filter(r=>inWin(r.date,n)).reduce((a,r)=>a+swingsOf(r),0);
  const roundsIn=n=>db.rounds.filter(r=>inWin(r.date,n)).length;
  const acute=swingsIn(7), chronicWk=swingsIn(28)/4;
  const acwr=chronicWk>0?(acute/chronicWk):null;
  const flags=SS.filter(x=>x.wrist>1).length;
  const areaCount={}; AREAS.forEach(a=>areaCount[a]=0);
  SS.forEach(x=>x.areas.forEach(a=>{if(areaCount[a]!==undefined)areaCount[a]++}));
  const ts=SS.concat(db.rounds).map(x=>Date.parse(x.date)).filter(t=>!isNaN(t));
  const oldest=ts.length?Math.min.apply(null,ts):0;
  const weeks=oldest?Math.floor((now-oldest)/(7*day)):0;
  return `
  <h3 class="eyebrow" style="margin:20px 0 0">Load</h3>
  <p class="hint" style="margin:2px 0 8px">Every swing that isn't a putt: practice balls, warm-up balls, and strokes minus putts from each round. All counted, none estimated. Both prior flares followed a ramp.</p>
  <div class="grid3">
    <div class="met"><div class="v">${acute}</div><div class="l">Swings · 7 d</div></div>
    <div class="met"><div class="v">${Math.round(chronicWk)}</div><div class="l">Swings · 28 d avg</div></div>
    <div class="met"><div class="v" style="color:${acwr&&acwr>1.5?'var(--red)':'inherit'}">${acwr?acwr.toFixed(2):'—'}</div><div class="l">Acute : chronic</div></div>
  </div>
  ${acwr&&acwr>1.5
    ?`<div class="banner bad">This week is ${acwr.toFixed(1)}× your recent average${weeks<4?' — short baseline, treat as indicative':''}. Around 1.5 is where both prior flares started.</div>`
    :(weeks<4?`<div class="banner">${weeks} weeks of history. The ratio firms up after four.</div>`:'')}
  <div class="card">
    <div class="kv"><span>Rounds · 7 d / 28 d</span><b>${roundsIn(7)} / ${roundsIn(28)}</b></div>
    <div class="kv"><span>Sessions logged</span><b>${SS.length}</b></div>
    <div class="kv"><span>Sessions with wrist soreness+</span><b style="color:${flags?'var(--red)':'inherit'}">${flags}</b></div>
    ${AREAS.map(a=>`<div class="kv"><span>${a}</span><b>${areaCount[a]}</b></div>`).join('')}
  </div>`;
}

/* ---------- DATA ---------- */
let impMsg='', saveMsg='', armed='';
function importData(){
  var ta=document.getElementById('imp');
  var raw=ta&&ta.value?String(ta.value).trim():'';
  if(!raw){impMsg='Paste the JSON block first.';render();return;}
  var d=null;
  try{d=JSON.parse(raw);}catch(e){
    impMsg='That is not valid JSON. Copy the whole block including the outer braces.';render();return;}
  if(!d||(!d.rounds&&!d.sessions)){impMsg='No rounds or sessions found in that JSON.';render();return;}
  var have={},haveS={},aR=0,aS=0;
  (db.rounds||[]).forEach(function(r){have[r.id]=1;});
  (db.sessions||[]).forEach(function(x){haveS[x.id]=1;});
  (d.rounds||[]).forEach(function(r){if(r&&r.id&&!have[r.id]){db.rounds.push(r);aR++;}});
  (d.sessions||[]).forEach(function(x){if(x&&x.id&&!haveS[x.id]){db.sessions.push(x);aS++;}});
  if(d.stride&&!db.stride)db.stride=d.stride;
  db.rounds.sort(function(a,b){return String(a.date||'').localeCompare(String(b.date||''))||(a.id-b.id);});
  migrate(); save();
  impMsg='Imported '+aR+' round'+(aR===1?'':'s')+' and '+aS+' session'+(aS===1?'':'s')+'. Duplicates skipped. Total now '+db.rounds.length+' rounds.';
  render();
}
function renderData(){
  const el=document.getElementById('v-data');
  el.innerHTML=`
  ${!storeOk?`<div class="banner bad">Storage isn't responding. Copy the export below before you close this.</div>`:''}
  ${flash?`<div class="banner"><b>${esc(flash)}</b></div>`:''}

  <div class="card" style="margin-top:14px">
    <div class="kv"><span>Storage</span><b style="color:${STMODE==='none'?'var(--red)':'var(--pine)'}">${
      STMODE==='app'?'Claude app':(STMODE==='browser'?'this browser':'NONE')}</b></div>
    <div class="kv"><span>Rounds held</span><b>${db.rounds.length}</b></div>
    <div class="kv"><span>Build</span><b>${VER}</b></div>
  </div>
  <p class="hint">${STMODE==='app'
    ?'Saving through the Claude app. If I hand you an updated file, the new copy may start empty — export first, import after.'
    :(STMODE==='browser'
      ?'Saving to this browser. Survives restarts as long as you open the same file in the same browser and do not clear site data.'
      :'Nothing is being saved. Export after every round.')}</p>

  <h3 class="eyebrow" style="margin:22px 0 6px">Legend</h3>
  <p class="hint" style="margin:0 0 8px">Every field, what it means and why it is shaped that way. The hole screen stays short on purpose — this is where the definitions live.</p>
  <button class="big ghost" onclick="legend=!legend;render()">${legend?'Hide legend':'Show legend'}</button>
  ${legend?`<div class="card" style="margin-top:2px"><h3 class="eyebrow" style="margin:18px 0 6px">Tier 1 — every round</h3><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Score / Putts</div><p class="hint" style="margin:0">Sit at the bottom of the hole screen, below everything else, because they are the last thing you know. Both prefill (score = par, putts = 2), so a hole you never touched and a par with two putts look identical in the data. The star check cannot see a missing score.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Tee</div><p class="hint" style="margin:0">Where the ball finished laterally: Fairway / Left / Right / Other. <b>Other</b> is on line but not in the fairway — short, topped, fairway bunker on your line. OB and water are <i>not</i> Other: a drive OB left is Tee = Left plus Penalty = OB. Side is what costs you strokes, not depth, which is why the field only measures side.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Club</div><p class="hint" style="margin:0">Tee club. Feeds the driver-versus-3W comparison, which is confounded by selection: 3W gets used on the harder holes, so a raw loss-rate comparison between the two is not a like-for-like read.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Next shot was just back in play</div><p class="hint" style="margin:0">The tee shot left you unable to go at the green. A judgement about options, not about how the lie felt. Par 4 and 5 only.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">2nd shot (par 5)</div><p class="hint" style="margin:0"><b>Went</b> = you took on the green with the second. <b>Laid up</b> = you chose not to. <b>Never on</b> = no choice existed, because the tee shot was in trouble or no club reached. Separating choice from circumstance is the whole point; collapsing them would credit or blame a decision you never made.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Green</div><p class="hint" style="margin:0">GIR by the strict definition — on the putting surface in regulation. Fringe is not on.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Penalty</div><p class="hint" style="margin:0">OB / Water / Other. <b>Other</b> is unplayable, lost ball that is not OB, staked trees, rules penalties — it exists so that OB and Water stay clean, because your hazard framework is built on those two. <b>It was the tee shot</b> keeps the tee club from being blamed for a shot it did not hit.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Picked up / given</div><p class="hint" style="margin:0">Voids score and putts for the hole, keeps every other field. Use it rather than guessing a number.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Stars on the hole strip</div><p class="hint" style="margin:0">Solid star = a Tier 1 field is empty. Faint star = a Tier 2 field is empty. Only holes you have already touched are checked. One star per hole, Tier 1 wins.</p></div><h3 class="eyebrow" style="margin:18px 0 6px">Tier 2 — the approach</h3><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">This shot</div><p class="hint" style="margin:0"><b>At the green</b> or <b>Never at it</b>. Tier 2 always describes the approach — the shot you actually went at the green with, however many strokes in. If you punched out on the second and hit the green with the third, that is <i>At the green</i> with Shot # 3; the punch-out is already recorded by <i>Next shot was just back in play</i>. <b>Never at it</b> means no shot on the hole was aimed at the green, and it is what tells the star check that empty approach fields are legitimate rather than forgotten. Only <i>At the green</i> holes feed the short:long ratio.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Shot #</div><p class="hint" style="margin:0">Which stroke the approach was. Derived from par and the par-5 second-shot choice; tap to correct when a reload or a punch-out shifted it.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Flag</div><p class="hint" style="margin:0">Lasered distance to the flag. Objective, no adjustment applied.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">±%</div><p class="hint" style="margin:0">Types a percentage and fills <b>Play to</b> for you — <code>+10</code>, <code>-5</code>, <code>7.5</code>, <code>10%</code> all work. It stores nothing: the percentage is recoverable from Flag and Play to, so the box is a live readout of your adjustment as much as an input. Needs a Flag first. Clearing it leaves Play to alone. Wind reference: <b>1.25% per mph into, 0.5% per mph downwind</b> — not the symmetric 1% rule.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Play to</div><p class="hint" style="margin:0">The number you committed to hit after wind, elevation and lie. Logged separately from Flag so that a bad number and a bad strike never collapse into the same datapoint. The gap between the two <i>is</i> your adjustment, recorded for free.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Distance / Line</div><p class="hint" style="margin:0">Both judged against <b>Play to</b>, never the flag. Short:long is the documented 5:1 leak; left:right completes the accessibility matrix.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Not a stock swing</div><p class="hint" style="margin:0">Stock means your normal swing with that club, whatever number you gave it today — a PW you decided plays 135 is still stock. Flag only knockdowns, three-quarters, punches and shaped shots. If it fires on every windy hole it carries no signal and the distance calibration loses its filter.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Fat / Hosel</div><p class="hint" style="margin:0">Blank by default and blank almost always. Only for strikes you would call unambiguous: a proper chunk, or a hosel strike you knew the moment it left. An event log for wrist load and early extension, not a strike-quality grade — anything that flew its number gets nothing. Available on lay-ups and punch-outs too, because a chunked punch-out loads the wrist the same.</p></div><h3 class="eyebrow" style="margin:18px 0 6px">Tier 2 — missed green</h3><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Position</div><p class="hint" style="margin:0">Short-sided = under roughly 8 m of green between ball and flag, or a bunker, water or severe slope sitting on the line. Judge it standing over the ball <b>before</b> you play the recovery. Judged afterwards it records how the shot turned out instead of where you were, which is the error that made the old proximity data worthless. Two buttons on purpose: blank means you forgot, not that you had room.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Recovery</div><p class="hint" style="margin:0">The <b>first</b> recovery shot only. Chip is greenside and running. Pitch is a full-ish wedge that flies, roughly 25 m and up. Putted on is from off the surface.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">After it</div><p class="hint" style="margin:0">Where the ball <b>physically was</b> once that first recovery came to rest — on the putting surface or not. Fringe counts as not on. Not a judgement of the shot: a chip to three paces you then three-putt is <i>On the green</i>, and a thinned chip eighteen paces past but on the surface is also <i>On the green</i>. That one's cost shows up as first-putt distance instead, which is where it actually lands. Crossed against Position, this separates a greenside strike problem from an approach aiming problem.</p></div><h3 class="eyebrow" style="margin:18px 0 6px">Tier 2 — putting</h3><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">1st putt</div><p class="hint" style="margin:0">Paced steps from the ball to the hole, never an estimate in feet, however the ball got there — iron, chip or bunker shot. Pace it as you walk in; enter it last. Buckets are cut where make rate roughly halves, not evenly.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Miss · speed / Miss · line</div><p class="hint" style="margin:0">Two independent axes, because both can be wrong at once and one combined field would discard that. Low side never had a chance; on line means only the speed was wrong. Magnitude stays out deliberately — a three-putt already records itself, and a severity button would be an outcome judgement.</p></div><h3 class="eyebrow" style="margin:18px 0 6px">Round close</h3><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Bag</div><p class="hint" style="margin:0">Carried, push cart or buggy. Fatigue and forearm load in one field, worth keeping separable from everything else.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Warm-up</div><p class="hint" style="margin:0">Balls / putts / minutes / route as four numbers. Balls carry wrist load, putts do not, minutes are the connective-tissue warm-up you are not allowed to shorten. One figure called ‘32’ told you none of that.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Wind</div><p class="hint" style="margin:0">Round level. Distance data from a windy round is not comparable with a calm one — one tap keeps them separable, and it is the filter that decides whether your short bias is wind judgement or carry numbers.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Wrist</div><p class="hint" style="margin:0">Symptoms after the round, on the same record as the load that produced them, so a flare has a visible ramp. Next-morning check is the cleaner recovery signal.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Close out after X</div><p class="hint" style="margin:0">Drops the remaining holes at save. <b>Back to holes</b> restores every hole exactly as it was — nothing is marked played by opening the close-out screen.</p></div><h3 class="eyebrow" style="margin:18px 0 6px">Rules of the block</h3><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Paces, not feet</div><p class="hint" style="margin:0">Every short-game distance is paced steps, converted by the stride figure below. Yards from the rangefinder for everything full-swing. Never mix the two.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">Two-tier entry</div><p class="hint" style="margin:0">Approach fields after the approach shot. Score and putts after holing out. Anything entered from memory on the next tee is worth less than a blank.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">No conclusions before round 20</div><p class="hint" style="margin:0">Block-level findings wait. Single rounds are anecdotes, and a good score can be built on poor ball-striking that the short game covered.</p></div><div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="font-weight:600;font-size:13px;margin-bottom:3px">9 versus 18</div><p class="hint" style="margin:0">A 9-hole differential is doubled to an 18-hole equivalent and marked ≈. Never compare a raw 9-hole number with an 18-hole one.</p></div></div>`:''}

  <h3 class="eyebrow" style="margin:22px 0 6px">Restore from backup</h3>
  <p class="hint" style="margin:0 0 8px">Paste a previously exported JSON block. Existing rounds are kept — anything already here is skipped, so importing twice does no harm.</p>
  <textarea id="imp" placeholder='{"rounds":[...],"sessions":[...]}' style="min-height:70px;font-family:'IBM Plex Mono',monospace;font-size:11px"></textarea>
  <button class="big ghost" onclick="importData()">Import</button>
  <p class="hint" id="imsg">${esc(impMsg)}</p>

  <h3 class="eyebrow" style="margin:22px 0 6px">Appearance</h3>
  <div class="seg">${['auto','light','dark'].map(t=>
    `<button class="${(db.theme||'auto')===t?'on':''}" onclick="setTheme('${t}')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
  <p class="hint">Auto follows your phone. Force Light in bright sun — dark screens wash out on the tee.</p>

  <h3 class="eyebrow" style="margin:20px 0 6px">Stride</h3>
  <div class="card">
    <p class="hint" style="margin:0 0 8px">Metres per step. Pace a long known distance and divide — the longer the better, because rangefinder error is fixed per reading, so a 20 m baseline carries roughly ±9% and a 100 m baseline about ±2%. Nine percent is a full metre at the 7-10 / 11+ boundary. Pace it on the surface you actually pace on; stride shortens on a green.</p>
    <input class="mono" inputmode="decimal" placeholder="m per step, e.g. 1.01" value="${db.stride??''}"
      onchange="db.stride=this.value?+this.value:null;save()">
    ${db.stride?`<p class="hint" style="margin:8px 0 0">At ${db.stride} m/step: ${PUTT_B.map(b=>{
      var p=b.replace('+','').split('-');
      var lo=Math.round(+p[0]*db.stride*10)/10;
      var hi=p[1]?Math.round(+p[1]*db.stride*10)/10:null;
      return b+' = '+(hi?lo+'\u2013'+hi:lo+'+')+' m';}).join(' \u00b7 ')}</p>`:''}
  </div>

  <h3 class="eyebrow" style="margin:20px 0 6px">Export</h3>
  <p class="hint" style="margin:0 0 8px">Copy and paste into chat. Summary for a read; full JSON to move the data.</p>
  <button class="big" onclick="copy(summaryText())">Copy summary</button>
  <button class="big ghost" onclick="copy(JSON.stringify({rounds:db.rounds,sessions:db.sessions,stride:db.stride}))">Copy full JSON</button>
  <textarea id="out" readonly style="width:100%;height:190px;font-family:'IBM Plex Mono',monospace;
    font-size:11px;border:1px solid var(--line);border-radius:3px;padding:9px;background:var(--surf);color:var(--ink)"
    >${esc(summaryText())}</textarea>
  <p class="hint" id="cmsg"></p>`;
}
function copy(t){
  const ta=document.getElementById('out');ta.value=t;ta.select();
  let ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  if(navigator.clipboard){navigator.clipboard.writeText(t).catch(()=>{});ok=true;}
  document.getElementById('cmsg').textContent=ok?'Copied.':'Select the text above and copy manually.';
}
function summaryText(){
  const R=db.rounds;if(!R.length)return'No rounds logged yet.';
  const S=R.map(sum);
  let o='JAN — ROUND LOG · '+R.length+' rounds · build '+VER+'\n';
  o+='stride: '+(db.stride?db.stride+' m/step':'not calibrated')+'\n\n';
  o+='date       course              n  score  diff  gir   fir   putts d+  ob  bag      wrist  wind\n';
  R.forEach((r,i)=>{const s=S[i];
    o+=r.date+' '+((CLABEL[r.course]||r.course)+'                    ').slice(0,19)+' '+String(r.n).padStart(2)+
      String(s.score).padStart(7)+String(diffLabel(r)).replace('\u2014','-').padStart(6)+
      String(s.girPct+'%').padStart(6)+String(s.firPct+'%').padStart(6)+
      String(s.putts).padStart(6)+String(s.dbl).padStart(4)+String(s.ob).padStart(4)+
      (s.pu?'  PU'+s.pu:'')+'  '+(r.carry||'-')+
      '  '+['none','ache','sore','pain'][r.wristPost??0]+'  '+(r.wind||'-')+'\n';});
  const AllA=R.flatMap(r=>r.holes).filter(h=>h.appD||h.appL);
  const A=AllA.filter(h=>h.appKind!=='punch'&&h.appKind!=='lay');
  const cD=k=>A.filter(h=>h.appD===k).length, cL=k=>A.filter(h=>h.appL===k).length;
  o+='\napproaches at the green: '+A.length+'  (greens hit '+A.filter(h=>h.gir===true).length+')\n';
  o+='excluded: lay-ups '+AllA.filter(h=>h.appKind==='lay').length+
     ' | punch-outs '+AllA.filter(h=>h.appKind==='punch').length+
     ' | no kind flag (still counted above) '+AllA.filter(h=>!h.appKind).length+'\n';
  o+='vs own number   short '+cD('short')+' | on '+cD('pin')+' | long '+cD('long')+'\n';
  o+='vs own line     left '+cL('left')+' | on '+cL('ctr')+' | right '+cL('right')+'\n';
  o+='non-stock swings flagged: '+A.filter(h=>h.appAlt).length+'\n';
  const bc={},pc={};
  AllA.filter(h=>h.appKind!=='punch').forEach(h=>{const d=+h.appDist||0; if(!h.appClub||!d)return;
    (bc[h.appClub]=bc[h.appClub]||[]).push(d);
    if(h.appD==='pin'&&!h.appAlt)(pc[h.appClub]=pc[h.appClub]||[]).push(d);});
  if(Object.keys(bc).length){o+='\nclub  n  plays-to  true (stock swings, on number)\n';
    CLUBS.filter(k=>bc[k]).forEach(k=>{const a=bc[k].slice().sort((x,y)=>x-y),b=(pc[k]||[]).slice().sort((x,y)=>x-y);
      o+=(k+'    ').slice(0,5)+String(a.length).padStart(3)+String(a[Math.floor(a.length/2)]).padStart(12)+
        String(b.length?b[Math.floor(b.length/2)]:'-').padStart(17)+'\n';});}
  const T={};R.flatMap(r=>r.holes).forEach(h=>{if(h.par<=3||!h.teeClub)return;const k=h.teeClub;
    T[k]=T[k]||{n:0,fw:0,pen:0,ob:0,dbl:0,out:0};T[k].n++;if(h.tee==='hit')T[k].fw++;
    if(h.teeOut)T[k].out++;
    if(h.pen&&h.penTee)T[k].pen++;if(h.pen==='OB'&&h.penTee)T[k].ob++;
    if(h.tee&&h.tee!=='hit'&&!h.pu&&h.score-h.par>=2)T[k].dbl++;});
  if(Object.keys(T).length){o+='\ntee club  n  fw%  blocked%  pen  ob  cost\n';
    TEE_CLUBS.filter(k=>T[k]).forEach(k=>{const b=T[k];
      o+=(k+'      ').slice(0,9)+String(b.n).padStart(2)+String(Math.round(100*b.fw/b.n)+'%').padStart(6)+
        String(Math.round(100*b.out/b.n)+'%').padStart(9)+
        String(b.pen).padStart(6)+String(b.ob).padStart(4)+String(b.dbl).padStart(6)+'\n';});}
  const fp={};PUTT_B.forEach(b=>fp[b]=0);R.flatMap(r=>r.holes).forEach(h=>{if(h.fp)fp[h.fp]++});
  o+='\nfirst putt (paced steps)\n';
  PUTT_B.forEach(function(b){
    var hs=R.flatMap(function(r){return r.holes}).filter(function(h){return h.fp===b&&!h.pu});
    if(!hs.length)return;
    var made=hs.filter(function(h){return h.putts===1}).length;
    var three=hs.filter(function(h){return h.putts>=3}).length;
    o+='  '+(b+'      ').slice(0,7)+'n='+String(hs.length).padStart(3)+
       '  made '+String(made).padStart(3)+' ('+Math.round(100*made/hs.length)+'%)'+
       (three?'  3-putts '+three:'')+'\n';});
  var PM=R.flatMap(function(r){return r.holes}).filter(function(h){return !h.pu&&h.putts>1&&(h.fpD||h.fpL)});
  if(PM.length){
    var cm=function(f,v,set){return (set||PM).filter(function(h){return h[f]===v}).length;};
    o+='\nfirst putt misses: '+PM.length+'\n';
    o+='  speed  short '+cm('fpD','short')+' | hole high '+cm('fpD','hole')+' | past '+cm('fpD','past')+'\n';
    o+='  line   high '+cm('fpL','high')+' | on line '+cm('fpL','on')+' | low '+cm('fpL','low')+'\n';
    PUTT_B.forEach(function(b){
      var g=PM.filter(function(h){return h.fp===b});
      if(!g.length)return;
      o+='  '+(b+'      ').slice(0,7)+'miss n='+String(g.length).padStart(3)+
         '  short '+cm('fpD','short',g)+'  past '+cm('fpD','past',g)+
         '  low '+cm('fpL','low',g)+'  on line '+cm('fpL','on',g)+'\n';});
  }
  var P5=R.flatMap(function(r){return r.holes}).filter(function(h){return h.par===5&&h.p5});
  if(P5.length){
    o+='\npar 5 second shot\n';
    [['went-on-green','hit'],['went-missed','miss'],['laid-up','lay'],['never-on','no']].forEach(function(x){
      var g=P5.filter(function(h){return h.p5===x[1]&&!h.pu});
      if(!g.length)return;
      var d=g.reduce(function(a,h){return a+h.score-h.par},0)/g.length;
      o+='  '+(x[0]+'              ').slice(0,16)+'n='+String(g.length).padStart(3)+
         '  vs par '+(d>=0?'+':'')+d.toFixed(2)+
         '  birdies '+g.filter(function(h){return h.score<h.par}).length+'\n';});
  }
  var ms=R.flatMap(function(r){return r.holes}).filter(function(h){return h.gir===false&&!h.pu});
  var uds=ms.filter(function(h){return h.putts===1});
  o+='\nup and down: '+uds.length+' of '+ms.length+
     (ms.length?' ('+Math.round(100*uds.length/ms.length)+'%)':'')+'\n';
  ['chip','pitch','bunker','putt'].forEach(function(k){
    var g=R.flatMap(function(r){return r.holes}).filter(function(h){return h.rec===k});
    if(g.length)o+='  '+(k+'      ').slice(0,7)+g.filter(function(h){return h.putts===1}).length+' of '+g.length+'\n';});
  var ssL=ms.filter(function(h){return h.ss===true||h.ss===false});
  if(ssL.length){
    var ssY=ssL.filter(function(h){return h.ss===true}),ssN=ssL.filter(function(h){return h.ss===false});
    var u=function(g){return g.filter(function(h){return h.putts===1}).length};
    var dd=function(g){return g.filter(function(h){return h.score-h.par>=2}).length};
    o+='\nshort-sided: '+ssY.length+' of '+ssL.length+' logged misses ('+
       Math.round(100*ssY.length/ssL.length)+'%)'+
       ((ms.length-ssL.length)?'  ['+(ms.length-ssL.length)+' blank]':'')+'\n';
    o+='  short-sided  u&d '+u(ssY)+'/'+ssY.length+'  doubles+ '+dd(ssY)+'\n';
    o+='  room         u&d '+u(ssN)+'/'+ssN.length+'  doubles+ '+dd(ssN)+'\n';
    var cn=function(g,f,v){return g.filter(function(h){return h[f]===v}).length};
    o+='  short-sided approach miss: short '+cn(ssY,'appD','short')+' long '+cn(ssY,'appD','long')+
       ' left '+cn(ssY,'appL','left')+' right '+cn(ssY,'appL','right')+'\n';
  }
  var AB=R.flatMap(function(r){return r.holes}).filter(function(h){return atGreen(h)&&(h.appD||h.appL)});
  var BO=AB.filter(function(h){return adj(h)!==null});
  if(BO.length){
    var av=BO.map(adj).sort(function(x,y){return x-y});
    var cS=function(g,v){return g.filter(function(h){return h.appD===v}).length};
    var upG=BO.filter(function(h){return adj(h)>=5}),flG=BO.filter(function(h){return Math.abs(adj(h))<5});
    o+='\nflag vs play number: '+BO.length+' of '+AB.length+' approaches carry both\n';
    o+='  median adjustment '+av[Math.floor(av.length/2)]+' y\n';
    o+='  adjusted up   n='+upG.length+'  short '+cS(upG,'short')+' on '+cS(upG,'pin')+' long '+cS(upG,'long')+'\n';
    o+='  no adjustment n='+flG.length+'  short '+cS(flG,'short')+' on '+cS(flG,'pin')+' long '+cS(flG,'long')+'\n';
    [['appDist','play-to'],['appFlag','flag']].forEach(function(fx){
      var rows='';
      [[0,130,'<=130'],[131,155,'131-155'],[156,175,'156-175'],[176,999,'176+']].forEach(function(b){
        var g=AB.filter(function(h){var d=+h[fx[0]]||0;return d>0&&d>=b[0]&&d<=b[1]});
        if(!g.length)return;
        rows+='    '+(b[2]+'        ').slice(0,9)+'n='+String(g.length).padStart(3)+
          '  short '+String(cS(g,'short')).padStart(3)+'  on '+String(cS(g,'pin')).padStart(3)+
          '  long '+String(cS(g,'long')).padStart(3)+'\n';});
      if(rows)o+='  bands on '+fx[1]+' number\n'+rows;});
  }
  const notes=R.filter(r=>r.note);
  if(notes.length){o+='\nround notes\n'+notes.map(r=>r.date+': '+r.note).join('\n')+'\n';}
  const SS=db.sessions||[];
  if(SS.length){
    o+='\n\nPRACTICE · '+SS.length+' sessions\n';
    o+='date        balls  min  wrist  areas / clubs\n';
    SS.forEach(x=>{o+=x.date+String(x.balls||'-').padStart(7)+String(x.mins||'-').padStart(5)+
      '  '+(['none','ache','sore','pain'][x.wrist||0]+'   ').slice(0,5)+'  '+
      x.areas.join(', ')+(x.clubs.length?' | '+x.clubs.join(' '):'')+'\n';});
    const sn=SS.filter(x=>x.note);
    if(sn.length){o+='\nsession notes\n'+sn.map(x=>x.date+': '+x.note).join('\n')+'\n';}
    const tb=SS.reduce((a,x)=>a+(+x.balls||0),0);
    o+='\ntotal practice balls: '+tb+'\n';}
  var wu=R.reduce(function(a,r){return a+(+(r.wuBalls||r.warmup)||0)},0);
  var wp=R.reduce(function(a,r){return a+(+r.wuPutts||0)},0);
  var wm=R.reduce(function(a,r){return a+(+r.wuMins||0)},0);
  o+='\nwarm-up split: balls '+wu+' | putts '+wp+' | minutes '+wm+'\n';
  var rs=R.reduce(function(a,r){var t=0;(r.holes||[]).forEach(function(h){t+=(+h.score||0)-(+h.putts||0);});return a+Math.max(0,t)},0);
  o+='round swings (strokes minus putts): '+rs+'\n';
  return o;
}

load();
